<body class="w-site"><div id="site-header"></div><main id="site-main"><div class="w-legacy-app"><div data-server-rendered="true" id="__nuxt"></div></div><div class="w-container w-live-slot" data-live-catalog=""></div></main><script>window.__NUXT__={"layout":"default","data":[{"detailHealthTool":{"health_tools":{"id":10,"name":"Cek Gejala GERD","title":"Cek Gejala GERD","image":"/_media/cdn/uploads/imagestorage/banner-gerd-56-1787904644.png","icon":"/_media/cdn/uploads/imagestorage/icon-gerd-14-1787904530.png","color":"#DFE8F1","meta_title":"Cek Gejala GERD │ Kuesioner GERD-Q Online","meta_description":"Cek gejala GERD dengan kuesioner GERD-Q tervalidasi. Dapatkan gambaran risiko refluks asam lambung dan tips pencernaan sehat. Mulai skrining sekarang!","footer_content":"\u003ch2>\u003cstrong>Tentang Cek Gejala GERD&nbsp;\u003c/strong>\u003c/h2>\n\n\u003cp>Cek Gejala GERD adalah skrining mandiri yang membantu Anda mengetahui kemungkinan adanya gejala yang mengarah pada \u003cem>Gastroesophageal Reflux Disease\u003c/em> (GERD). Skrining ini bersifat informatif dan tidak menggantikan diagnosis maupun pemeriksaan tenaga medis.\u003c/p>\n\n\u003cp>Instrumen yang dipakai dalam skrining ini adalah \u003cem>GERD Questionnaire \u003c/em>(GERD-Q), kuesioner yang telah divalidasi klinis untuk mengidentifikasi kemungkinan \u003ca href=\"/blog/penyakit-gerd\">penyakit GERD\u003c/a> berdasarkan frekuensi gejala yang dialami dalam 7 hari terakhir.&nbsp;\u003c/p>\n\n\u003cp>Beberapa gejala yang dinilai, meliputi rasa panas di dada (\u003cem>heartburn\u003c/em>), naiknya isi lambung ke kerongkongan (regurgitasi), gangguan tidur akibat refluks, penggunaan obat pereda gejala, serta dampak refluks asam lambung terhadap aktivitas sehari-hari.\u003c/p>\n\n\u003ch2>\u003cstrong>Apa Itu GERD?\u003c/strong>\u003c/h2>\n\n\u003cp>GERD atau \u003cem>Gastroesophageal Reflux Disease\u003c/em> adalah kondisi ketika asam dan isi lambung naik kembali ke kerongkongan sehingga memicu gejala atau komplikasi. Mengalami refluks sesekali sebenarnya wajar dialami oleh siapa saja, tetapi jika terjadi berulang dan mengganggu kualitas hidup, kondisi tersebut dapat mengarah pada GERD.\u003c/p>\n\n\u003cp>Dilansir dari Cleveland Clinic, tanda dan gejala penyakit GERD yang paling umum, meliputi:\u003c/p>\n\n\u003cul>\n\t\u003cli>sensasi panas di dada (\u003cem>heartburn\u003c/em>),&nbsp;\u003c/li>\n\t\u003cli>isi lambung naik ke kerongkongan (regurgitasi),&nbsp;\u003c/li>\n\t\u003cli>\u003ca href=\"/blog/cara-mengatasi-nyeri-ulu-hati-pada-malam-hari\">nyeri ulu hati\u003c/a>,&nbsp;\u003c/li>\n\t\u003cli>rasa asam dan mengganjal di tenggorokan,&nbsp;\u003c/li>\n\t\u003cli>batuk kronis,&nbsp;\u003c/li>\n\t\u003cli>suara serak, hingga&nbsp;\u003c/li>\n\t\u003cli>gangguan tidur akibat refluks pada malam hari.&nbsp;\u003c/li>\n\u003c/ul>\n\n\u003cp>Pada sebagian orang, GERD juga bisa menyebabkan \u003ca href=\"/blog/penyebab-nyeri-dada-sebelah-kiri\">nyeri dada\u003c/a> yang menyerupai kondisi lain, seperti penyakit jantung. Kondisi ini penting dibedakan melalui pemeriksaan dokter.\u003c/p>\n\n\u003ch2>\u003cstrong>Komplikasi GERD\u003c/strong>\u003c/h2>\n\n\u003cp>Jika tidak ditangani dengan baik, penyakit GERD yang berlangsung dalam jangka panjang bisa menyebabkan peradangan pada kerongkongan (\u003cem>esofagitis\u003c/em>) hingga penyempitan kerongkongan (\u003cem>esophageal stricture\u003c/em>).\u003c/p>\n\n\u003cp>Kondisi kerongkongan atau esofagus yang iritasi akibat paparan asam lambung di dalam waktu lama juga meningkatkan risiko terjadinya \u003cem>Barrett&#39;s esophagus\u003c/em>, kondisi perubahan pada lapisan mukosa esofagus yang berkaitan dengan peningkatan risiko kanker kerongkongan.\u003c/p>\n\n\u003cp>Tidak hanya berdampak pada \u003ca href=\"/diseases/gangguan-pencernaan\">saluran pencernaan\u003c/a>, GERD juga bisa memengaruhi kualitas tidur, produktivitas, serta aktivitas sehari-hari akibat gejala yang muncul berulang.\u003c/p>\n\n\u003ch2>\u003cstrong>Penyebab dan Faktor Risiko GERD\u003c/strong>\u003c/h2>\n\n\u003cp>Penyebab utama GERD adalah melemah&nbsp; atau tidak berfungsinya \u003cem>lower esophageal sphincter\u003c/em> (LES), yaitu katup otot yang memisahkan kerongkongan dari lambung.&nbsp;\u003c/p>\n\n\u003cp>Dalam kondisi normal, LES menutup rapat setelah makanan masuk ke lambung. Apabila katup ini melemah atau terlalu sering membuka, \u003ca href=\"/blog/cara-mengatasi-asam-lambung-naik\">asam lambung naik\u003c/a> kembali ke kerongkongan dan menimbulkan iritasi pada lapisan dindingnya.\u003c/p>\n\n\u003cp>Selain itu, faktor gaya hidup juga berperan besar dalam kemunculan gejala. Tabel di bawah ini merangkum faktor-faktor yang bisa meningkatkan risiko seseorang terkena GERD.\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:201px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Faktor Risiko\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:423px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Mekanisme\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:201px\">\n\t\t\t\u003cp>Kelebihan berat badan dan obesitas\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:423px\">\n\t\t\t\u003cp>Tekanan perut meningkat akan mendorong LES terbuka.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:201px\">\n\t\t\t\u003cp>Kebiasaan merokok\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:423px\">\n\t\t\t\u003cp>Melemahkan tonus LES dan mengurangi produksi air liur (saliva).\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:201px\">\n\t\t\t\u003cp>Makan porsi besar atau menjelang tidur\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:423px\">\n\t\t\t\u003cp>Kondisi lambung penuh meningkatkan tekanan pada LES.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:201px\">\n\t\t\t\u003cp>Konsumsi makanan atau minuman pemicu\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:423px\">\n\t\t\t\u003cp>Kopi, cokelat, dan minuman berkarbonasi dapat menurunkan tekanan pada LES.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:201px\">\n\t\t\t\u003cp>Kehamilan\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:423px\">\n\t\t\t\u003cp>Perubahan hormon dan tekanan lambung akibat rahim membesar membuat LES terbuka.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:201px\">\n\t\t\t\u003cp>Penggunaan obat-obatan tertentu\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:423px\">\n\t\t\t\u003cp>Beberapa jenis obat dapat melemahkan LES.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003ch2>\u003cstrong>Kapan Harus ke Dokter?\u003c/strong>\u003c/h2>\n\n\u003cp>Gejala refluks ringan yang muncul sesekali umumnya masih dapat dikelola dengan perubahan gaya hidup. Namun, ada kondisi tertentu yang memerlukan evaluasi medis lebih lanjut, karena dapat mengindikasikan komplikasi atau kondisi lain yang lebih serius.&nbsp;\u003c/p>\n\n\u003cp>Jika gejala yang Anda alami tidak kunjung membaik atau disertai dengan tanda-tanda di bawah ini, segera jadwalkan konsultasi dengan dokter.\u003c/p>\n\n\u003cul>\n\t\u003cli>Gejala muncul lebih dari 2 kali dalam seminggu atau semakin sering kambuh.\u003c/li>\n\t\u003cli>Gejala tidak membaik meskipun sudah melakukan perubahan pola hidup.\u003c/li>\n\t\u003cli>Muncul rasa nyeri yang menyebabkan kesulitan saat menelan.\u003c/li>\n\t\u003cli>Muntah darah atau buang air besar berwarna hitam.\u003c/li>\n\t\u003cli>Penurunan berat badan tanpa sebab yang jelas.\u003c/li>\n\t\u003cli>Nyeri dada berat, terutama bila disertai sesak napas, keringat dingin, atau nyeri menjalar ke lengan dan rahang.\u003c/li>\n\u003c/ul>\n\n\u003ch2>\u003cstrong>Tips untuk Membantu Mengurangi Gejala GERD\u003c/strong>\u003c/h2>\n\n\u003cp>Beberapa perubahan gaya hidup di bawah ini dapat membantu mengurangi gejala refluks pada sebagian orang.\u003c/p>\n\n\u003ch3>\u003cstrong>1. Jaga Porsi dan Waktu Makan\u003c/strong>\u003c/h3>\n\n\u003cp>Makan dalam porsi besar sekaligus akan meningkatkan tekanan pada lambung dan mendorong asam naik ke kerongkongan. Biasakan makan dalam porsi lebih kecil tapi lebih sering.&nbsp; Hindari makan 2&ndash;3 jam sebelum tidur agar lambung punya waktu cukup untuk mengosongkan isinya.\u003c/p>\n\n\u003ch3>\u003cstrong>2. Identifikasi dan Batasi Makanan Pemicu\u003c/strong>\u003c/h3>\n\n\u003cp>Setiap individu punya \u003ca href=\"/blog/inilah-makanan-pantangan-asam-lambung-yang-wajib-dihindari-jangan-sampai-salah\">pemicu GERD\u003c/a> yang berbeda. Makanan tinggi lemak, pedas, cokelat, kopi, minuman bersoda, dan alkohol diketahui dapat melonggarkan katup lambung. Catat makanan yang memperburuk gejala Anda, lalu mulai batasi konsumsinya secara bertahap.\u003c/p>\n\n\u003ch3>\u003cstrong>3. Jaga Berat Badan Tetap Ideal\u003c/strong>\u003c/h3>\n\n\u003cp>Kelebihan berat badan dapat meningkatkan tekanan pada rongga perut sehingga mendorong isi lambung naik ke kerongkongan. Menurunkan berat badan melalui pola makan seimbang hingga aktivitas fisik teratur membantu mengurangi frekuensi dan intensitas gejala GERD.\u003c/p>\n\n\u003ch3>\u003cstrong>4. Berhenti Merokok\u003c/strong>\u003c/h3>\n\n\u003cp>Nikotin dalam rokok diketahui dapat melemahkan tonus \u003cem>lower esophageal sphincter \u003c/em>(LES) dan mengurangi produksi air liur (saliva), yang berperan untuk menetralkan asam di kerongkongan. \u003ca href=\"/blog/bahaya-merokok-bagi-kesehatan\">Berhenti merokok\u003c/a> membantu memperkuat fungsi katup lambung serta mengurangi keparahan gejala refluks secara keseluruhan.\u003c/p>\n\n\u003ch3>\u003cstrong>5. Sesuaikan Gaya Berpakaian untuk Ibu Hamil\u003c/strong>\u003c/h3>\n\n\u003cp>Tekanan pada perut akibat pakaian ketat akan memperburuk gejala refluks, khususnya selama kehamilan ketika rahim yang membesar sudah memberikan tekanan tambahan pada lambung. Gunakan pakaian yang longgar di area perut untuk membantu mengurangi tekanan tersebut.\u003c/p>\n\n\u003cdiv style=\"background:#eeeeee; border:1px solid #cccccc; padding:5px 10px\">\n\u003ch2>\u003cstrong>Disclaimer\u003c/strong>\u003c/h2>\n\n\u003cp>Hasil Cek Gejala GERD ini bersifat \u003cstrong>informatif dan tidak menggantikan diagnosis medis\u003c/strong>.&nbsp;Jika gejala sering muncul, semakin berat, atau disertai tanda bahaya, segera konsultasikan dengan tenaga kesehatan untuk mendapatkan pemeriksaan dan penanganan yang sesuai.\u003c/p>\n\u003c/div>\n\n\u003cp style=\"text-align:center\">&nbsp;\u003c/p>\n\n\u003cp>\u003cstrong>References:&nbsp;\u003c/strong>\u003c/p>\n\n\u003cul>\n\t\u003cli>Cleveland Clinic. (2023). \u003cem>Heartburn: What it feels like, causes &amp; treatment\u003c/em>. Retrieved July 8, 2026, from https://my.clevelandclinic.org/health/diseases/17019-acid-reflux-gerd\u003c/li>\n\t\u003cli>Harvard Health. (2026). \u003cem>Gastroesophageal reflux disease (GERD)\u003c/em>. Harvard Medical School. Retrieved July 8, 2026, from https://www.health.harvard.edu/a_to_z/gastroesophageal-reflux-disease-gerd-a-to-z\u003c/li>\n\t\u003cli>Ismail, P. (2024). \u003cem>What causes acid reflux during pregnancy and how to relieve it?\u003c/em> EMC Healthcare. Retrieved July 8, 2026, from https://www.emc.id/en/care-plus/what-causes-acid-reflux-during-pregnancy-and-how-to-relieve-it\u003c/li>\n\t\u003cli>Katz, P. O., Dunbar, K. B., Schnoll-Sussman, F. H., Greer, K. B., Yadlapati, R., &amp; Spechler, S. J. (2022). ACG Clinical Guideline for the Diagnosis and Management of Gastroesophageal Reflux Disease. \u003cem>American Journal of Gastroenterology\u003c/em>, \u003cem>117\u003c/em>(1), 27&ndash;56. https://doi.org/10.14309/ajg.0000000000001538\u003c/li>\n\t\u003cli>Mayo Clinic. (2025). \u003cem>Gastroesophageal reflux disease (GERD): Diagnosis &amp; treatment\u003c/em>. Retrieved July 8, 2026, from https://www.mayoclinic.org/diseases-conditions/gerd/diagnosis-treatment/drc-20361959\u003c/li>\n\t\u003cli>Memorial Sloan Kettering Cancer Center. (2024). \u003cem>Gastroesophageal reflux disease (GERD)\u003c/em>. Retrieved July 8, 2026, from https://www.mskcc.org/cancer-care/patient-education/gastroesophageal-reflux-disease-gerd\u003c/li>\n\t\u003cli>National Institute of Diabetes and Digestive and Kidney Diseases. (n.d.). \u003cem>Acid reflux (GER &amp; GERD) in adults\u003c/em>. U.S. Department of Health and Human Services. Retrieved July 8, 2026, from https://www.niddk.nih.gov/health-information/digestive-diseases/acid-reflux-ger-gerd-adults\u003c/li>\n\t\u003cli>Perkasa, S. (2026). \u003cem>Manage your stomach acid better: 5 powerful tips to prevent GERD recurrence and improve your quality of life\u003c/em>. EMC Healthcare. Retrieved July 8, 2026, from https://www.emc.id/en/care-plus/manage-your-stomach-acid-better-5-powerful-tips-to-prevent-gerd-recurrence-and-improve-your-quality-of-life\u003c/li>\n\t\u003cli>Zavala-Gonz&aacute;les, M. A., Azamar-Jacome, A. A., Meixueiro-Daza, A., de la Medina, A. R., Job Reyes-Huerta, J., Roesch-Dietlen, F., &amp; Remes-Troche, J. M. (2014). Validation and diagnostic usefulness of gastroesophageal reflux disease questionnaire in a primary care level in Mexico. \u003cem>Journal of Neurogastroenterology and Motility\u003c/em>, \u003cem>20\u003c/em>(4), 475&ndash;482. https://doi.org/10.5056/jnm14014\u003c/li>\n\u003c/ul>","min_app_version":"1.3.38","type":"scoring","category_id":2,"slug":"cek-gejala-gerd","formula_male":"[gerd_heartburn]+[gerd_regurgitation]+[gerd_epigastric]+[gerd_nausea]+[gerd_sleep]+[gerd_medication]","formula_female":"[gerd_heartburn]+[gerd_regurgitation]+[gerd_epigastric]+[gerd_nausea]+[gerd_sleep]+[gerd_medication]","description":"Perut sering terasa tidak nyaman? Cari tahu apakah keluhan Anda mengarah ke GERD","is_active":1},"health_faq":[{"id":119,"tool_id":10,"question":"Penyakit GERD itu seperti apa?","answer":"GERD atau Gastroesophageal Reflux Disease adalah kondisi ketika asam lambung naik ke kerongkongan akibat lemahnya katup antara lambung dan kerongkongan. Kondisi ini bisa memicu sensasi dada terbakar (heartburn), mulut pahit, dan mengganggu aktivitas."},{"id":120,"tool_id":10,"question":"Apa ciri-ciri GERD kambuh?","answer":"GERD kambuh ditandai dengan sensasi terbakar di dada (heartburn), rasa asam atau pahit di mulut akibat makanan atau cairan lambung naik ke kerongkongan (regurgitasi), nyeri dada, sulit menelan, batuk kronis, atau suara serak."},{"id":121,"tool_id":10,"question":"Apa penyebab GERD?","answer":"GERD terjadi karena katup lambung tidak menutup rapat sehingga asam lambung naik. Risikonya meningkat akibat obesitas, merokok, kehamilan, konsumsi makanan tertentu, hingga kebiasaan makan dalam porsi besar menjelang tidur."},{"id":122,"tool_id":10,"question":"Apa yang tidak boleh dimakan penderita GERD?","answer":"Penderita GERD disarankan membatasi beberapa jenis makanan yang berpotensi memperburuk gejala, seperti makanan tinggi lemak, pedas, cokelat, kopi, minuman bersoda, alkohol, dan makanan asam."},{"id":123,"tool_id":10,"question":"GERD dan asam lambung apakah sama?","answer":"Tidak. Asam lambung adalah cairan yang diproduksi secara normal untuk membantu pencernaan, sedangkan GERD adalah kondisi saat asam lambung naik ke kerongkongan, sehingga memicu gejala serta dapat menyebabkan komplikasi bila tidak ditangani."},{"id":124,"tool_id":10,"question":"Jika terkena GERD, apa yang harus dilakukan?","answer":"Apabila mengalami gejala GERD, makanlah dalam porsi kecil, hindari makanan pemicu, jangan berbaring 2–3 jam setelah makan, dan jaga berat badan ideal. Jika gejala sering kambuh dan makin berat, segera konsultasikan dengan dokter."},{"id":128,"tool_id":10,"question":"Referensi","answer":"Clevel
