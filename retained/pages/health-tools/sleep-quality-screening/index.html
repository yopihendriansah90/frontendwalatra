<body class="w-site"><div id="site-header"></div><main id="site-main"><div class="w-legacy-app"><div data-server-rendered="true" id="__nuxt"></div></div><div class="w-container w-live-slot" data-live-catalog=""></div></main><script>window.__NUXT__={"layout":"default","data":[{"detailHealthTool":{"health_tools":{"id":7,"name":"Skrining Kualitas Tidur","title":"Skrining Kualitas Tidur","image":"/_media/cdn/uploads/imagestorage/sleep-71-1784106548.png","icon":"/_media/cdn/uploads/imagestorage/icon-sleep-64-1784104446.png","color":"#EDEAFF","meta_title":"Skrining Kualitas Tidur Online │ Tes Kualitas Tidur Gratis","meta_description":"Cek kualitas tidur Anda dengan skrining online gratis. Ketahui apakah tidur Anda sudah cukup baik atau perlu diperbaiki. Dapatkan saran praktis di sini!","footer_content":"\u003ch2>\u003cstrong>Tentang Skrining Kualitas Tidur\u003c/strong>\u003c/h2>\n\n\u003cp>Skrining kualitas tidur adalah proses evaluasi mandiri yang dirancang untuk memberi gambaran awal mengenai pola dan kebiasaan tidur seseorang. Berbeda dengan diagnosis medis, skrining hanya bersifat informatif, tetapi dapat jadi langkah pertama untuk mengenali apakah tidur Anda sudah memenuhi standar yang direkomendasikan.\u003c/p>\n\n\u003cp>Instrumen yang digunakan dalam skrining ini adalah \u003cstrong>Insomnia Severity Index (ISI)\u003c/strong>, yang telah diakui secara klinis untuk menilai tingkat keparahan \u003ca href=\"/blog/cara-menghilangkan-insomnia\">insomnia\u003c/a>. ISI mengevaluasi 7 aspek utama, yaitu kesulitan memulai tidur, kesulitan mempertahankan tidur, masalah terbangun terlalu dini, kepuasan terhadap pola tidur saat ini, dampak gangguan tidur pada aktivitas harian, tingkat gangguan yang dirasakan oleh orang lain, dan tingkat kecemasan akibat masalah tidur.\u003c/p>\n\n\u003ch2>\u003cstrong>Mengapa Kualitas Tidur Penting untuk Kesehatan?\u003c/strong>\u003c/h2>\n\n\u003cp>Tidur bukan sekadar waktu istirahat. Selama tidur, tubuh menjalankan beberapa proses biologis penting, mulai dari pemulihan sel, pemrosesan memori, hingga pengaturan hormon.&nbsp;\u003c/p>\n\n\u003cp>Menurut Centers for Disease Control and Prevention (CDC), orang dewasa yang \u003ca href=\"/blog/cara-mengatasi-susah-tidur\">kurang tidur\u003c/a> di mana waktu tidurnya kurang dari 7 jam setiap malam berisiko lebih tinggi mengalami gangguan kesehatan kronis.\u003c/p>\n\n\u003cp>Sebaliknya, tidur yang berkualitas dengan durasi 7&ndash;9 jam per malam pada orang dewasa sudah dikaitkan dengan peningkatan produktivitas kerja , keseimbangan emosional, dan kualitas hidup yang lebih baik secara keseluruhan.\u003c/p>\n\n\u003ch3>\u003cstrong>Dampak Kurang Tidur pada Tubuh\u003c/strong>\u003c/h3>\n\n\u003cp>Kekurangan tidur yang berlangsung terus-menerus bisa berdampak buruk pada berbagai aspek kesehatan, di antaranya seperti pada tabel di bawah ini.\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:163px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Sistem Tubuh\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:461px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Dampak Kurang Tidur\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:163px\">\n\t\t\t\u003cp>Kardiovaskular\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:461px\">\n\t\t\t\u003cp>Meningkatkan risiko tekanan darah tinggi (hipertensi) dan penyakit jantung.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:163px\">\n\t\t\t\u003cp>Metabolisme\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:461px\">\n\t\t\t\u003cp>Meningkatkan risiko obesitas dan diabetes tipe 2.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:163px\">\n\t\t\t\u003cp>Imunitas\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:461px\">\n\t\t\t\u003cp>Menurunkan kemampuan tubuh menghadapi infeksi mikroorganisme berbahaya (virus, bakteri, jamur).\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:163px\">\n\t\t\t\u003cp>Kesehatan mental\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:461px\">\n\t\t\t\u003cp>Memperburuk gejala kecemasan dan depresi.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:163px\">\n\t\t\t\u003cp>Fungsi kognitif\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:461px\">\n\t\t\t\u003cp>Mengganggu konsentrasi, daya ingat, dan pengambilan keputusan.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003ch2>\u003cstrong>Mengenali Jenis Gangguan Tidur\u003c/strong>\u003c/h2>\n\n\u003cp>Tidak semua masalah susah tidur tergolong insomnia. Penting untuk memahami perbedaan tiap jenisnya agar penanganan yang diambil sesuai dengan kondisi yang dialami.\u003c/p>\n\n\u003cp>Menurut tingkat keparahannya, insomnia dikategorikan dalam beberapa jenis sebagai berikut.\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cstrong>Insomnia ringan. \u003c/strong>Kesulitan tidur terjadi sesekali dan tidak mengganggu aktivitas harian secara signifikan. Umumnya dapat diatasi dengan perbaikan \u003cem>sleep hygiene\u003c/em>.\u003c/li>\n\t\u003cli>\u003cstrong>Insomnia sedang. \u003c/strong>Gangguan tidur terjadi lebih sering serta memengaruhi produktivitas dan suasana hati. Perubahan gaya hidup dan intervensi medis mungkin diperlukan.\u003c/li>\n\t\u003cli>\u003cstrong>Insomnia berat. \u003c/strong>Masalah terjadi hampir tiap malam serta berdampak nyata pada fungsi harian. Membutuhkan evaluasi dan penanganan oleh tenaga profesional, baik itu oleh psikolog atau dokter spesialis tidur.\u003c/li>\n\u003c/ul>\n\n\u003ch3>\u003cstrong>Kapan Harus Berkonsultasi dengan Dokter?\u003c/strong>\u003c/h3>\n\n\u003cp>Segera konsultasi ke tenaga kesehatan bila Anda mengalami beberapa kondisi di bawah ini.\u003c/p>\n\n\u003cul>\n\t\u003cli>Kesulitan tidur berlangsung lebih dari 3 kali seminggu selama lebih dari satu bulan.\u003c/li>\n\t\u003cli>Gangguan tidur mulai memengaruhi pekerjaan, hubungan sosial, atau kesehatan fisik.\u003c/li>\n\t\u003cli>Terbangun dengan perasaan tidak segar, meskipun durasi tidur sudah cukup.\u003c/li>\n\t\u003cli>Muncul gejala penyerta, seperti nyeri, sesak napas, dan perubahan suasana hati yang signifikan.\u003c/li>\n\u003c/ul>\n\n\u003ch2>\u003cstrong>Langkah Memperbaiki Kualitas Tidur secara Mandiri\u003c/strong>\u003c/h2>\n\n\u003cp>Sebelum mempertimbangkan intervensi medis, perbaikan \u003ca href=\"/blog/sleep-hygiene\">\u003cem>sleep hygiene\u003c/em>\u003c/a>\u003cem> \u003c/em>adalah langkah awal yang bisa dilakukan. Berikut ini beberapa kebiasaan untuk mendukung tidur berkualitas.\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cstrong>Konsistensi jadwal. \u003c/strong>Tidur dan bangun di waktu yang sama setiap hari, termasuk pada akhir pekan, membantu menstabilkan ritme sirkadian tubuh.\u003c/li>\n\t\u003cli>\u003cstrong>Lingkungan tidur yang kondusif. \u003c/strong>Pastikan kamar gelap, sejuk (sekitar 18&ndash;22&deg;C), dan minim gangguan suara.\u003c/li>\n\t\u003cli>\u003cstrong>Batasi stimulan.\u003c/strong> Hindari \u003ca href=\"/blog/makanan-yang-mengandung-kafein\">konsumsi kafein\u003c/a>, khususnya kopi, setelah pukul 2 siang serta batasi konsumsi alkohol menjelang waktu tidur.\u003c/li>\n\t\u003cli>\u003cstrong>Rutinitas sebelum tidur.\u003c/strong> Lakukan aktivitas menenangkan 30&ndash;60 menit sebelum tidur, seperti membaca buku, meditasi, atau latihan pernapasan.\u003c/li>\n\t\u003cli>\u003cstrong>Batasi penggunaan layar.\u003c/strong> Cahaya biru dari perangkat elektronik, misal ponsel dan TV, menghambat produksi melatonin, hormon yang mengatur siklus tidur-bangun.\u003c/li>\n\u003c/ul>\n\n\u003cdiv style=\"background:#eeeeee; border:1px solid #cccccc; padding:5px 10px\">\n\u003ch2>\u003cstrong>Disclaimer\u003c/strong>\u003c/h2>\n\n\u003cp>Hasil skrining ini bersifat \u003cstrong>informatif dan tidak menggantikan diagnosis medis\u003c/strong>. Tes kualitas tidur dirancang sebagai evaluasi mandiri berdasarkan pola dan kebiasaan tidur Anda. Untuk kondisi yang memerlukan penanganan lebih lanjut, disarankan untuk berkonsultasi dengan tenaga kesehatan profesional.\u003c/p>\n\u003c/div>\n\n\u003cp style=\"text-align:center\">&nbsp;\u003c/p>\n\n\u003cp>\u003cstrong>References:&nbsp;\u003c/strong>\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cem>About sleep. \u003c/em>(2025). U.S. Centers for Disease Control and Prevention. Retrieved July 6, 2026, from https://www.cdc.gov/sleep/about/\u003c/li>\n\t\u003cli>Noyed, D., &amp; Rehman, A. (2025). \u003cem>How is sleep quality calculated? \u003c/em>Sleep Foundation. Retrieved July 6, 2026, from https://www.sleepfoundation.org/sleep-hygiene/how-is-sleep-quality-calculated\u003c/li>\n\t\u003cli>Meadows, A., &amp; Cotliar, D. (2026). \u003cem>How to fall asleep fast. \u003c/em>Sleep Foundation. Retrieved July 6, 2026, from https://www.sleepfoundation.org/sleep-hygiene/how-to-fall-asleep-fast\u003c/li>\n\t\u003cli>Pacheho, D., &amp; Singh, A. (2025). \u003cem>Sleep vitamins. \u003c/em>Sleep Foundation. Retrieved July 6, 2026, from https://www.sleepfoundation.org/sleep-aids/vitamins-for-sleep\u003c/li>\n\t\u003cli>Suni, E., &amp; Smith, K. (2026). \u003cem>Types of insomnia. \u003c/em>Sleep Foundation. Retrieved July 6, 2026, from https://www.sleepfoundation.org/insomnia/types-of-insomnia\u003c/li>\n\t\u003cli>\u003cem>What are sleep deprivation and deficiency? \u003c/em>(2022). National Hearth, Lung, and Blood Institute. Retrieved July 6, 2026, from https://www.nhlbi.nih.gov/health/sleep-deprivation\u003c/li>\n\t\u003cli>\u003cem>Treatment. \u003c/em>(2022). National Hearth, Lung, and Blood Institute. Retrieved July 6, 2026, from https://www.nhlbi.nih.gov/health/insomnia/treatment\u003c/li>\n\t\u003cli>\u003cem>Insomnia. \u003c/em>(2025). Cleveland Clinic. Retrieved July 6, 2026, from https://my.clevelandclinic.org/health/diseases/12119-insomnia\u003c/li>\n\t\u003cli>\u003cem>Insomnia. \u003c/em>(2024). NHS UK. Retrieved July 6, 2026, from https://www.nhs.uk/conditions/insomnia/\u003c/li>\n\t\u003cli>Taylor, K., &amp; Abe, Y. (2026). \u003cem>Insomnia in women: Why you can&rsquo;t sleep &amp; how to fix it now. \u003c/em>Ubie. Retrieved July 6, 2026, from https://ubiehealth.com/doctors-note/what-causes-insomnia-women-hormone-stress-47-roots122e3\u003c/li>\n\t\u003cli>Cronkleton, E., &amp; Biggers, A. (2024). \u003cem>8 insomnia home remedies: Exercises, oils, and more. \u003c/em>Healthline. Retrieved July 6, 2026, from https://www.healthline.com/health/healthy-sleep/insomnia-home-remedies\u003c/li>\n\u003c/ul>","min_app_version":"1.3.36","type":"math","category_id":2,"slug":"sleep-quality-screening","formula_male":"[sleep_onset] + [sleep_maintenance] + [early_waking] + [sleep_satisfaction] + [noticeable] + [worry] + [daily_impact]","formula_female":null,"description":"Tidur sudah cukup berkualitas? Jawab kuisioner singkat dan ketahui kondisi tidur Anda sekarang","is_active":1},"health_faq":[{"id":88,"tool_id":7,"question":"Kualitas tidur yang baik seperti apa?","answer":"Kualitas tidur yang baik ditandai dengan durasi cukup, bisa tertidur dalam 20–30 menit, jarang terbangun di malam hari, serta bangun dengan tubuh segar dan berenergi. Tidur nyenyak dan konsisten juga menandakan kualitas tidur yang baik."},{"id":89,"tool_id":7,"question":"Apa ciri-ciri kekurangan tidur?","answer":"Ciri-ciri kurang tidur, meliputi mengantuk di siang hari, sulit konsentrasi, mudah lupa, dan mood tidak stabil. Jika terus berlanjut, kurang tidur bisa meningkatkan risiko obesitas, diabetes, tekanan darah tinggi (hipertensi), hingga penyakit jantung."},{"id":90,"tool_id":7,"question":"Bagaimana caranya agar tidur berkualitas?","answer":"Tidur berkualitas dimulai dengan tidur dan bangun di waktu yang sama setiap hari, batasi kafein di malam hari, jauhi gadget 60 menit sebelum tidur, serta ciptakan suasana ruangan yang nyaman, gelap, dan sejuk. Olahraga dan manajemen stres juga dapat membantu meningkatkan kualitas tidur."},{"id":91,"tool_id":7,"question":"Bagaimana cara agar cepat ngantuk?","answer":"Lakukan rutinitas yang menenangkan sebelum tidur, seperti membaca buku atau latihan pernapasan. Hindari gadget 60 menit sebelum tidur karena cahaya biru mengganggu produksi melatonin. Jika sulit tidur terus-menerus, konsultasikan dengan tenaga kesehatan."},{"id":92,"tool_id":7,"question":"Minum vitamin apa agar tidur nyenyak?","answer":"Tidak ada vitamin yang secara khusus menjamin tidur nyenyak. Akan tetapi, magnesium, vitamin B6, dan vitamin D berpotensi mendukung kualitas tidur. Konsultasikan dengan tenaga kesehatan sebelum mengonsumsi suplemen apa pun."},{"id":93,"tool_id":7,"question":"Bagaimana cara mengetahui kualitas tidur?","answer":"Kualitas tidur bisa diketahui melalui skrining yang mengevaluasi durasi tidur, waktu untuk tertidur, frekuensi terbangun, dan kondisi tubuh saat bangun. Hasil skrining memberikan gambaran awal mengenai kualitas tidur, tetapi tidak menggantikan diagnosis oleh tenaga kesehatan."},{"id":125,"tool_id":7,"question":"Referensi","answer":"About sleep. (2025). U.S. Centers for Disease Control and Prevention. Retrieved July 6, 2026, from https://www.cdc.gov/sleep/about/\nNoyed, D., & Rehman, A. (2025). How is sleep quality calculated? Sleep Foundation. Retrieved July 6, 2026, from https://www.sleepfoundation.org/sleep-hygiene/how-is-sleep-quality-calculated\nMeadows, A., & Cotliar, D. (2026). How to fall asleep fast. Sleep Foundation. Retrieved July 6, 2026, from https://www.sleepfoundation.org/sleep-hygiene/how-to-fall-asleep-fast"}],"health_questions":[{"step":1,"questions":[{"id":48,"tool_id":7,"step":1,"sequence":1,"variable_name":"name","validate":"required|string|min:3|max:255","question_text":"Siapa nama Anda?","question_image":null,"description":null,"input_type":"text","is_gender_specific":"0","suffix":null,"default":null,"health_questions_options":[]},{"id":49,"tool_id":7,"step":1,"sequence":2,"variable_name":"gender","validate":"required|integer|in:1,2","question_text":"Apa jenis kelamin Anda?","question_image":null,"descripti
