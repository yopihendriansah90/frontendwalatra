<body class="w-site"><div id="site-header"></div><main id="site-main"><div class="w-legacy-app"><div data-server-rendered="true" id="__nuxt"></div></div><div class="w-container w-live-slot" data-live-catalog=""></div></main><script>window.__NUXT__={"layout":"default","data":[{"detailHealthTool":{"health_tools":{"id":1,"name":"Kalkulator BMI","title":"Kalkulator BMI","image":"/_media/cdn/uploads/imagestorage/banner-bmi-2-52-1769593277.png","icon":"/_media/cdn/uploads/imagestorage/icon-bmi-33-1769049255.png","color":"#EBF6F4","meta_title":"Kalkulator BMI Online │Cek Berat Badan Ideal","meta_description":"Gunakan Kalkulator BMI Online untuk tahu apakah berat badan Anda kurus, normal, kelebihan berat badan, atau obesitas. Cek gratis dan cepat sekarang!","footer_content":"\u003ch2>\u003cstrong>Tentang Kalkulator BMI\u003c/strong>\u003c/h2>\n\n\u003cp>Kalkulator BMI (Body Mass Index) atau Indeks Massa Tubuh (IMT) adalah alat ukur sederhana yang digunakan untuk menilai status \u003ca href=\"/diseases/berat-badan\">berat badan\u003c/a> seseorang berdasarkan perbandingan berat badan dan tinggi badan.&nbsp;\u003c/p>\n\n\u003cp>Hasilnya dinyatakan dalam satuan kg/m&sup2; yang umum digunakan sebagai indikator awal dalam mengidentifikasi apakah berat badan berada di dalam kategori kurang, normal, berlebih, atau \u003ca href=\"/blog/apa-itu-obesitas\">obesitas\u003c/a>.\u003c/p>\n\n\u003cp>BMI dihitung dengan rumus:\u003c/p>\n\n\u003cp style=\"text-align:center\">\u003cstrong>BMI = Berat Badan (kg) &divide; Tinggi Badan (m)&sup2;\u003c/strong>\u003c/p>\n\n\u003cp>Sebagai contoh, seseorang dengan berat badan 68 kg dan tinggi 165 cm memiliki BMI = 68 &divide; (1,65 &times; 1,65) = 24,98. Hasil tersebut masuk kategori BMI Normal.\u003c/p>\n\n\u003ch3>\u003cstrong>Kategori BMI dan Interpretasinya\u003c/strong>\u003c/h3>\n\n\u003cp>Terdapat dua standar kategori BMI yang umum digunakan: standar WHO (global) dan standar Asia-Pasifik yang direkomendasikan untuk populasi Asia, termasuk Indonesia (WHO Expert Consultation, 2004).\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Kategori\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>BMI (Standar WHO)\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>BMI (Standar Asia-Pasifik)\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp>Berat Badan Kurang\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">&lt; 18,5\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">&lt; 18,5\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp>Normal\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">18,5 &ndash; 24,9\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">18,5 &ndash; 22,9\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp>Kelebihan Berat Badan\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">25,0 &ndash; 29,9\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">23,0 &ndash; 24,9\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp>Obesitas\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">&ge; 30,0&nbsp;\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">&ge; 25,0\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003cp>\u003cem>*) Catatan: Kalkulator BMI di halaman ini menggunakan standar Asia-Pasifik yang lebih sesuai untuk populasi Indonesia.\u003c/em>\u003c/p>\n\n\u003ch2>\u003cstrong>Mengapa BMI Penting untuk Kesehatan?\u003c/strong>\u003c/h2>\n\n\u003cp>Hasil pengukuran ini menjadi salah satu indikator awal yang digunakan tenaga kesehatan untuk menilai risiko berbagai kondisi kronis. Penelitian ilmiah menunjukkan bahwa BMI di luar rentang normal, baik terlalu rendah maupun terlalu tinggi, berkaitan dengan peningkatan risiko penyakit serius (Tan et al., 2023; Sattar et al., 2024).\u003c/p>\n\n\u003cp>\u003cstrong>Tabel Risiko Kesehatan Berdasarkan Kategori BMI\u003c/strong>\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:212px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Kategori BMI\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:412px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Risiko Kesehatan Utama\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:212px\">\n\t\t\t\u003cp>Berat Badan Kurang\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:412px\">\n\t\t\t\u003cp>Kekurangan nutrisi, anemia, osteoporosis, gangguan imun\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:212px\">\n\t\t\t\u003cp>Normal\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:412px\">\n\t\t\t\u003cp>Risiko penyakit kronis paling rendah\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:212px\">\n\t\t\t\u003cp>Kelebihan Berat Badan\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:412px\">\n\t\t\t\u003cp>Hipertensi, resistensi insulin, dislipidemia\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:212px\">\n\t\t\t\u003cp>Obesitas\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:412px\">\n\t\t\t\u003cp>Diabetes tipe 2, penyakit jantung, stroke, sleep apnea\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003cp>Mengetahui BMI sejak dini bisa memungkinkan Anda mengambil langkah pencegahan sebelum risiko tersebut berkembang menjadi kondisi medis yang lebih serius.&nbsp;\u003c/p>\n\n\u003cp>Sebuah meta-analisis terhadap lebih dari 1,3 juta pengidap diabetes menemukan bahwa setiap kenaikan 5 unit BMI berkaitan dengan peningkatan risiko kejadian kardiovaskular sebesar 9% (Zhao et al., 2021).\u003c/p>\n\n\u003ch2>\u003cstrong>Keterbatasan BMI sebagai Pengukuran Kesehatan\u003c/strong>\u003c/h2>\n\n\u003cp>BMI adalah alat skrining, bukan alat diagnosis. Ada beberapa kondisi saat hasil BMI tidak cukup akurat untuk menggambarkan kondisi kesehatan seseorang secara menyeluruh (Ralston et al., 2025).\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cstrong>Atlet dan individu aktif.\u003c/strong> Massa otot yang tinggi bisa membuat BMI tampak lebih besar meski lemak tubuh rendah.\u003c/li>\n\t\u003cli>\u003cstrong>Lansia. \u003c/strong>Penurunan massa otot alami atau sarkopenia dapat menyebabkan BMI tampak normal meski komposisi lemak tubuh sudah tinggi.\u003c/li>\n\t\u003cli>\u003cstrong>Ibu hamil. \u003c/strong>Perubahan berat badan selama masa kehamilan membuat BMI tidak relevan sebagai indikator status gizi.\u003c/li>\n\t\u003cli>\u003cstrong>Anak dan remaja (di bawah 18 tahun).\u003c/strong> Penilaian status berat badan anak memerlukan grafik pertumbuhan khusus berdasarkan usia dan jenis kelamin.\u003c/li>\n\u003c/ul>\n\n\u003cp>Untuk gambaran kesehatan yang lebih lengkap, BMI harus dikombinasikan dengan pengukuran lain, seperti \u003ca href=\"/blog/cara-mengukur-lingkar-pinggang-dengan-alat-seadanya-memang-bisa\">pengukuran lingkar pinggang\u003c/a>, persentase lemak tubuh, dan tes laboratorium.\u003c/p>\n\n\u003ch2>\u003cstrong>Kapan Harus Berkonsultasi ke Dokter?\u003c/strong>\u003c/h2>\n\n\u003cp>Segera konsultasikan dengan dokter atau tenaga kesehatan bila Anda memiliki kondisi berikut.\u003c/p>\n\n\u003cul>\n\t\u003cli>BMI Anda berada jauh di bawah 18,5 dan disertai sering kelelahan, rambut rontok, atau gangguan menstruasi.\u003c/li>\n\t\u003cli>BMI Anda berada di atas 27,5 yang disertai tekanan darah tinggi, kadar gula darah tidak normal, atau nyeri sendi.\u003c/li>\n\t\u003cli>\u003ca href=\"/blog/cara-cepat-menurunkan-berat-badan\">Berat badan turun\u003c/a> atau naik signifikan dalam waktu singkat tanpa sebab yang jelas.\u003c/li>\n\t\u003cli>Anda memiliki riwayat penyakit kronis, seperti diabetes, hipertensi, atau gangguan tiroid.\u003c/li>\n\t\u003cli>Program diet atau olahraga mandiri tidak menunjukkan perubahan setelah 8&ndash;12 minggu.\u003c/li>\n\u003c/ul>\n\n\u003ch2>\u003cstrong>Cara Mencapai dan Mempertahankan BMI Ideal\u003c/strong>\u003c/h2>\n\n\u003cp>Mencapai BMI ideal tidak harus dilakukan secara drastis. Perubahan kecil secara bertahap dan konsisten terbukti lebih efektif serta aman dalam jangka panjang.\u003c/p>\n\n\u003ch3>\u003cstrong>1. Untuk Berat Badan Kurang\u003c/strong>\u003c/h3>\n\n\u003cp>\u003ca href=\"/blog/cara-menaikkan-berat-badan-dengan-cepat\">Menaikkan berat badan yang sehat\u003c/a> memerlukan strategi yang terencana, tidak sekadar makan lebih banyak, tetapi memastikan asupan bergizi dan tubuh menyerap nutrisi dengan optimal.&nbsp;\u003c/p>\n\n\u003cp>Pada wanita, BMI di bawah 18,5 berkaitan dengan penurunan kepadatan tulang dan gangguan siklus menstruasi (Tamura et al., 2026).\u003c/p>\n\n\u003cul>\n\t\u003cli>Tambah asupan kalori bertahap dengan makanan padat gizi, seperti kacang-kacangan, alpukat, dan protein hewani.\u003c/li>\n\t\u003cli>Lakukan latihan beban intensitas ringan untuk membantu pembentukan massa otot.\u003c/li>\n\t\u003cli>Konsultasikan dengan ahli gizi jika berat badan susah naik meski asupan makan sudah ditingkatkan.\u003c/li>\n\u003c/ul>\n\n\u003ch3>\u003cstrong>2. Untuk Berat Badan Berlebih atau Obesitas\u003c/strong>\u003c/h3>\n\n\u003cp>Penurunan berat badan yang efektif tidak dapat dicapai dalam semalam. Pendekatan bertahap dan konsisten jauh lebih aman dibanding metode ekstrem yang berisiko memicu efek yo-yo.\u003c/p>\n\n\u003cul>\n\t\u003cli>Terapkan defisit kalori moderat, sekitar 300&ndash;500 kalori per hari tanpa mengorbankan kebutuhan nutrisi esensial.\u003c/li>\n\t\u003cli>Tingkatkan aktivitas fisik secara bertahap, bisa mulai dari 30 menit jalan kaki per hari.\u003c/li>\n\t\u003cli>Kurangi konsumsi makanan ultra-proses, tinggi gula, dan tinggi lemak jenuh.\u003c/li>\n\t\u003cli>Pantau perkembangan secara berkala serta libatkan tenaga kesehatan dalam proses penurunan berat badan.\u003c/li>\n\u003c/ul>\n\n\u003ch3>\u003cstrong>3. Untuk Mempertahankan BMI Normal\u003c/strong>\u003c/h3>\n\n\u003cp>BMI yang sudah ideal perlu dijaga secara aktif. Kebiasaan kecil yang dilakukan setiap hari lebih berpengaruh dibanding perubahan besar yang tidak konsisten.\u003c/p>\n\n\u003cul>\n\t\u003cli>Pertahankan \u003ca href=\"/blog/jenis-diet\">pola makan sehat dan seimbang\u003c/a>, terdiri dari karbohidrat kompleks, protein, lemak sehat, serta sayuran dan buah-buahan.\u003c/li>\n\t\u003cli>Lakukan aktivitas fisik minimal 150 menit per minggu sesuai rekomendasi WHO.\u003c/li>\n\t\u003cli>Jaga kualitas tidur 7&ndash;9 jam per malam, karena kurang tidur berkaitan dengan peningkatan nafsu makan dan penumpukan lemak.\u003c/li>\n\u003c/ul>\n\n\u003cdiv style=\"background:#eeeeee;border:1px solid #cccccc;padding:5px 10px;\">\n\u003ch2>\u003cstrong>Disclaimer\u003c/strong>\u003c/h2>\n\n\u003cp>Hasil Kalkulator BMI ini bersifat \u003cstrong>informatif dan tidak menggantikan diagnosis atau saran medis\u003c/strong>. BMI merupakan indikator awal status berat badan dan tidak mencerminkan kondisi kesehatan secara menyeluruh. Untuk evaluasi kesehatan yang lebih komprehensif, konsultasikan dengan dokter atau ahli gizi.\u003c/p>\n\u003c/div>\n\n\u003cp style=\"text-align:center\">&nbsp;\u003c/p>\n\n\u003cp>\u003cstrong>References:&nbsp;\u003c/strong>\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cem>About body mass index (BMI).\u003c/em> (2024). U.S. Centers for Diseases Control and Prevention. Retrieved February 18, 2026, from https://www.cdc.gov/bmi/about/index.html\u003c/li>\n\t\u003cli>\u003cem>Body mass index (BMI). \u003c/em>(2023). Cleveland Clinic. Retrieved February 18, 2026, from https://my.clevelandclinic.org/health/articles/9464-body-mass-index-bmi\u003c/li>\n\t\u003cli>WHO Expert Consultation (2004). Appropriate body-mass index for Asian populations and its implications for policy and intervention strategies. \u003cem>Lancet (London, England), 363\u003c/em>(9403), 157&ndash;163. https://doi.org/10.1016/S0140-6736(03)15268-3\u003c/li>\n\t\u003cli>Tamura, Y., Ogawa, W., Ishii, K., Ishigaki, Y., Nagai, N., Hirota, Y., Morino, K., Inokuchi, M., Suzuki, T., Tanaka, S., Terauchi, M., Nose-Ogura, S., Working Group on Female Underweight/Undernutrition Syndrome, &amp; Japan Society for the Study of Obesity (2026). Female Underweight/Undernutrition Syndrome (FUS): An Emerging Health Concept in Premenopausal Women - Secondary Publication (English Translation of the Japanese Statement). \u003cem>The journal of obstetrics and gynaecology research, 52\u003c/em>(2), e70201. https://doi.org/10.1111/jog.70201\u003c/li>\n\t\u003cli>Ralston, M. R., McCreath, G., Lees, Z. J., Salt, I. P., Sim, M. A., Watson, M. J., &amp; Freeman, D. J. (2025). Beyond body mass index: Exploring the role of visceral adipose tissue in intensive care unit outcomes.\u003cem> BJA Open, 14\u003c/em>, 100391. https://doi.org/10.1016/j.bjao.2025.100391\u003c/li>\n\t\u003cli>Sattar, N., Presslie, C., Rutter, M. K., &amp; McGuire, D. K. (2024). Cardiovascular and Kidney Risks in Individuals With Type 2 Diabetes: Contemporary Understanding With Greater Emphasis on Excess Adiposity. \u003cem>Diabetes care, 47\u003c/em>(4), 531&ndash;543. https://doi.org/10.2337/dci23-0041\u003c/li>\n\t\u003cli>Tan, L., Long, L. Z., Ma, X. C., Yang, W. W., Liao, F. F., Peng, Y. X., Lu, J. M., Shen, A. L., An, D. Q., Qu, H., &amp; Fu, C. G. (2023). Association of body mass index trajectory and hypertension risk: A systematic review of cohort studies and network meta-analysis of 89,094 participants. \u003cem>Frontiers in cardiovascular medicine, 9\u003c/em>, 941341. https://doi.org/10.3389/fcvm.2022.941341\u003c/li>\n\t\u003cli>Zhao, Y., Qie, R., Han, M., Huang, S., Wu, X., Zhang, Y., Feng, Y., Yang, X., Li, Y., Wu, Y., Liu, D., Hu, F., Zhang, M., Sun, L., &amp; Hu, D. (2021). Association of BMI with cardiovascular disease incidence and mortality in patients with type 2 diabetes mellitus: A systematic review and dose-response meta-analysis of cohort studies. \u003cem>Nutrition, metabolism, and cardiovascular diseases : NMCD, 31\u003c/em>(7), 1976&ndash;1984. https://doi.org/10.1016/j.numecd.2021.03.003\u003c/li>\n\u003c/ul>","min_app_version":null,"type":"math","category_id":1,"slug":"bmi-calculator","formula_male":"[weight] / (([height]/100) * ([height]/100))","formula_female":null,"description":"Berat badan sudah ideal? Cek BMI (Body Mass Index) berdasarkan tinggi dan berat badan Anda","is_active":1},"health_faq":[{"id":45,"tool_id":1,"question":"Apa itu BMI?","answer":"BMI (Body Mass Index) atau juga dikenal dengan IMT (Indeks Massa Tubuh) adalah metode sederhana untuk menilai status berat badan berdasarkan perbandingan berat badan dan tinggi badan.\nHasil BMI membantu mengklasifikasikan apakah seseorang memiliki tubuh yang masuk ke kategori Berat Badan Kurang, Normal (Ideal), Kelebihan Berat Badan, atau Obesitas."},{"id":46,"tool_id":1,"question":"Bagaimana cara menghitung BMI?","answer":"Rumus BMI adalah berat badan dibagi tinggi badan dalam meter kuadrat (WHO Expert Consultation, 2004). Contoh, jika berat badan Anda 70 kg dan tinggi 170 cm atau 1,7 meter, maka BMI = 70 ÷ (1,7 × 1,7) = 24,2. Anda bisa memakai Kalkulator BMI untuk menghitungnya secara otomatis dan praktis."},{"id":47,"tool_id":1,"question":"Apakah BMI bisa digunakan untuk semua orang?","answer":"BMI tidak selalu akurat untuk semua orang. Pengukuran ini kurang tepat bagi atlet dengan massa otot tinggi, ibu hamil, lansia dengan penurunan massa otot, serta anak dan remaja yang masih dalam masa pertumbuhan. \nKalkulator BMI dapat digunakan oleh orang dewasa (usia 18 tahun ke atas) untuk mendapatkan gambaran awal status berat badan berdasarkan perbandingan berat badan dan tinggi badan."},{"id":53,"tool_id":1,"question":"Mengapa BMI penting untuk kesehatan?","answer":"BMI yang berada di atas rentang normal membantu mengidentifikasi risiko berbagai penyakit seperti diabetes tipe 2, hipertensi, penyakit jantung, dan sindrom metabolik. Mengetahui kategori BMI lebih awal memungkinkan Anda mengambil langkah pencegahan sebelum risiko tersebut berkembang."},{"id":54,"tool_id":1,"question":"Apakah BMI normal berarti tubuh pasti sehat?","answer":"Tidak selalu. BMI hanya mengukur perbandingan berat dan tinggi badan, bukan komposisi tubuh. Seseorang bisa memiliki BMI normal tetapi memiliki kadar lemak tubuh tinggi, terutama lemak di dalam rongga perut (visceral fat) yang berisiko bagi kesehatan."},{"id":55,"tool_id":1,"question":"Apa yang harus dilakukan jika hasil BMI tidak normal?","answer":"Jika hasil BMI berada di bawah atau di atas rentang normal, jangan mengubah pola makan atau aktivitas secara drastis. Evaluasi pola makan, aktivitas fisik, serta kondisi kesehatan secara keseluruhan. \nNamun, ketika BMI berada jauh di bawah atau di atas rentang normal, konsultasikan dengan tenaga kesehatan untuk mengetahui penyebab dan menentukan langkah yang sesuai dengan kondisi Anda."},{"id":81,"tool_id":1,"question":"Referensi","answer":"(1) WHO Expert Consultation (2004). Appropriate body-mass index for Asian populations and its implications for policy and intervention strategies. Lancet (London, England), 363(9403), 157–163. https://doi.org/10.1016/S0140-6736(03)15268-3 | (2) About body mass index (BMI). (2024). U.S. Centers for Diseases Control and Prevention. Retrieved February 18, 2026, from https://www.cdc.gov/bmi/about/index.html | (3) Body mass index (BMI). (2023). Cleveland Clinic. Retrieved February 18, 2026, from https://my.clevelandclinic.org/health/articles/9464-body-mass-index-bmi"}],"health_questions":[{"step":1,"questions":[{"i
