<body class="w-site"><div id="site-header"></div><main id="site-main"><div class="w-legacy-app"><div data-server-rendered="true" id="__nuxt"></div></div><div class="w-container w-live-slot" data-live-catalog=""></div></main><script>window.__NUXT__={"layout":"default","data":[{"detailHealthTool":{"health_tools":{"id":2,"name":"Kalkulator Protein","title":"Kalkulator Protein","image":"/_media/cdn/uploads/imagestorage/banner-protein-2-50-1769593703.png","icon":"/_media/cdn/uploads/imagestorage/icon-protein-13-1769050203.png","color":"#E4F4E1","meta_title":"Kalkulator Protein Harian Akurat & Praktis","meta_description":"Pakai Kalkulator Protein untuk hitung kebutuhan protein menurut usia, berat badan, dan aktivitas. Cek untuk diet, pembentukan otot, dan gaya hidup aktif.","footer_content":"\u003ch2>\u003cstrong>Tentang Kalkulator Protein\u003c/strong>\u003c/h2>\n\n\u003cp>Kalkulator Protein adalah alat bantu digital untuk membantu memperkirakan kebutuhan \u003ca href=\"/cat/sports-nutrition/protein\">asupan protein\u003c/a> harian berdasarkan beberapa variabel, meliputi berat badan, usia, jenis kelamin, tingkat aktivitas fisik, dan tujuan kesehatan.&nbsp;\u003c/p>\n\n\u003cp>Berbeda dari panduan gizi pada umumnya, kalkulator ini bisa menghasilkan estimasi yang lebih personal, sehingga bisa dijadikan panduan awal sebelum konsultasi dengan tenaga kesehatan.\u003c/p>\n\n\u003cp>Protein merupakan salah satu dari 3 makronutrien utama yang dibutuhkan oleh tubuh, bersama karbohidrat dan lemak. Perannya tidak terbatas pada \u003ca href=\"/blog/kebutuhan-protein-harian-untuk-otot\">pembentukan otot\u003c/a>, protein juga jadi bahan dasar enzim, hormon, serta komponen struktural kulit dan organ (Carbone &amp; Pasiakos, 2019).&nbsp;\u003c/p>\n\n\u003cp>Oleh sebab itu, memahami kebutuhan protein harian yang tepat menjadi langkah penting dalam menjaga kesehatan tubuh secara menyeluruh.\u003c/p>\n\n\u003ch2>\u003cstrong>Mengapa Protein Penting untuk Tubuh?\u003c/strong>\u003c/h2>\n\n\u003cp>Protein menjalankan fungsi yang sangat luas di dalam tubuh manusia. Selain membangun serta memperbaiki jaringan otot, protein berperan dalam pembentukan hemoglobin, produksi enzim pencernaan, dan regulasi keseimbangan cairan dan pH darah.&nbsp;\u003c/p>\n\n\u003cp>Asupan protein yang cukup juga berkaitan erat dengan rasa kenyang yang lebih lama, sehingga mendukung pengelolaan berat badan secara alami (Carbone &amp; Pasiakos, 2019).\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:193px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Fungsi\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:431px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Penjelasan Singkat\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:193px\">\n\t\t\t\u003cp>Pembentukan dan perbaikan otot\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:431px\">\n\t\t\t\u003cp>Mendukung sintesis protein otot (MPS) setelah aktivitas fisik\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:193px\">\n\t\t\t\u003cp>Produksi enzim dan hormon\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:431px\">\n\t\t\t\u003cp>Komponen utama insulin, hormon pertumbuhan, dan enzim metabolisme\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:193px\">\n\t\t\t\u003cp>Sistem imun\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:431px\">\n\t\t\t\u003cp>Bahan dasar antibodi yang melawan infeksi\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:193px\">\n\t\t\t\u003cp>Transportasi nutrisi\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:431px\">\n\t\t\t\u003cp>Hemoglobin dan albumin mengangkut oksigen dan nutrisi\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:193px\">\n\t\t\t\u003cp>Keseimbangan cairan\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:431px\">\n\t\t\t\u003cp>Menjaga tekanan osmotik darah dan mencegah edema\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:193px\">\n\t\t\t\u003cp>Rasa kenyang\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:431px\">\n\t\t\t\u003cp>Meningkatkan hormon kenyang dan menekan nafsu makan\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003ch3>\u003cstrong>Dampak Kekurangan dan Kelebihan Protein\u003c/strong>\u003c/h3>\n\n\u003cp>Kekurangan protein jangka panjang memicu penurunan massa otot (sarkopenia), melemahnya sistem imun, gangguan pertumbuhan pada anak, serta kondisi kesehatan, seperti kwashiorkor dan marasmus, pada kasus yang parah.&nbsp;\u003c/p>\n\n\u003cp>Sebaliknya, konsumsi protein yang jauh melampaui kebutuhan harus diperhatikan, terlebih bagi orang dengan riwayat gangguan ginjal kronis .&nbsp;\u003c/p>\n\n\u003cp>Namun, bukti ilmiah saat ini menunjukkan bahwa untuk orang dewasa sehat, \u003ca href=\"/blog/diet-protein-tinggi\">diet protein tinggi\u003c/a> tidak menyebabkan kerusakan ginjal jangka panjang yang signifikan. Respons hiperfiltasi ginjal yang terjadi bersifat adaptif dan reversibel (Devries et al., 2018; Kamper &amp; Strandgaard, 2017).\u003c/p>\n\n\u003ch2>\u003cstrong>Cara Menghitung Kebutuhan Protein Harian\u003c/strong>\u003c/h2>\n\n\u003cp>Rekomendasi asupan protein harian bervariasi, bergantung kondisi dan tujuan masing-masing.&nbsp;\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:381px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Kelompok\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:243px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Kebutuhan Protein\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:381px\">\n\t\t\t\u003cp>Dewasa umum (aktivitas ringan)\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:243px\">\n\t\t\t\u003cp style=\"text-align:center\">0,8 g/kg berat badan/hari\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:381px\">\n\t\t\t\u003cp>Dewasa aktif dan berolahraga rutin\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:243px\">\n\t\t\t\u003cp style=\"text-align:center\">1,2&ndash;1,6 g/kg berat badan/hari\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:381px\">\n\t\t\t\u003cp>Atlet dan pembentukan massa otot\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:243px\">\n\t\t\t\u003cp style=\"text-align:center\">1,4&ndash;2,0 g/kg berat badan/hari\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:381px\">\n\t\t\t\u003cp>Program penurunan lemak dengan latihan intens\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:243px\">\n\t\t\t\u003cp style=\"text-align:center\">2,3&ndash;3,1 g/kg berat badan/hari\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003cp>Angka 0,8 g/kg merupakan standar Recommended Dietary Allowance (RDA) yang ditetapkan oleh USDA dan telah divalidasi sejak lama.&nbsp;\u003c/p>\n\n\u003cp>Sementara itu, untuk individu yang aktif berolahraga, International Society of Sports Nutrition (ISSN) merekomendasikan rentang 1,4&ndash;2,0 g/kg/hari sebagai jumlah yang cukup untuk membangun dan mempertahankan massa otot (Stokes et al., 2018).\u003c/p>\n\n\u003ch3>\u003cstrong>Faktor yang Mememengaruhi Kebutuhan Protein\u003c/strong>\u003c/h3>\n\n\u003cp>Beberapa faktor di bawah ini secara signifikan memengaruhi \u003ca href=\"/blog/kebutuhan-protein-harian\">kebutuhan protein harian\u003c/a>.\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cstrong>Usia.\u003c/strong> Lansia membutuhkan asupan protein lebih tinggi untuk mencegah sarkopenia dan mempertahankan massa otot yang cenderung menurun seiring bertambahnya usia.\u003c/li>\n\t\u003cli>\u003cstrong>Jenis kelamin.\u003c/strong> Perbedaan komposisi tubuh dan kadar hormon dapat memengaruhi laju sintesis protein otot.\u003c/li>\n\t\u003cli>\u003cstrong>Tingkat aktivitas fisik.\u003c/strong> Latihan resistensi dan aerobik meningkatkan kebutuhan protein untuk pemulihan dan adaptasi otot.\u003c/li>\n\t\u003cli>\u003cstrong>Tujuan.\u003c/strong> Target penurunan lemak, peningkatan massa otot, ataupun pemeliharaan berat badan memiliki kebutuhan protein yang berbeda.\u003c/li>\n\t\u003cli>\u003cstrong>Status kesehatan. \u003c/strong>Kondisi, meliputi kehamilan, pemulihan pascaoperasi, atau penyakit kronis mengubah kebutuhan protein secara signifikan.\u003c/li>\n\u003c/ul>\n\n\u003ch2>\u003cstrong>Sumber Protein Terbaik untuk Berbagai Tujuan\u003c/strong>\u003c/h2>\n\n\u003cp>Tidak semua sumber protein diciptakan sama. Kualitas protein diukur dengan metrik Digestible Indispensable Amino Acid Score (DIAAS), yang memperhitungkan kandungan asam amino esensial dan tingkat kecernaan protein tersebut di dalam tubuh (Herreman et al., 2020).\u003c/p>\n\n\u003ch3>\u003cstrong>1. Protein Hewani\u003c/strong>\u003c/h3>\n\n\u003cp>Protein hewani umumnya punya skor DIAAS lebih tinggi karena mengandung profil asam amino esensial lengkap. Casein, whey, telur, dan daging masuk kategori protein kualitas &quot;sangat baik&quot; dengan DIAAS di atas 100, sedangkan whey dan protein kedelai masuk kategori &quot;berkualitas tinggi&quot; dengan DIAAS &ge;75 (Herreman et al., 2020).\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cstrong>Protein whey. \u003c/strong>\u003ca href=\"/cat/sports-nutrition/protein/whey-protein\">Whey protein\u003c/a> dapat diserap cepat, kaya akan leusin untuk merangsang pembentukan protein otot, ideal dikonsumsi setelah latihan.\u003c/li>\n\t\u003cli>\u003cstrong>Protein kasein. \u003c/strong>Diserap lambat, lebih baik dikonsumsi sebelum tidur untuk mendukung pemulihan otot semalaman.\u003c/li>\n\t\u003cli>\u003cstrong>Telur, daging tanpa lemak, ikan.\u003c/strong> Sumber protein \u003cem>whole-food \u003c/em>berkualitas tinggi dengan tingkat penyerapan (bioavailabilitas) optimal.\u003c/li>\n\u003c/ul>\n\n\u003ch3>\u003cstrong>2. Protein Nabati\u003c/strong>\u003c/h3>\n\n\u003cp>Protein nabati umumnya memiliki DIAAS lebih rendah dan mungkin kekurangan satu atau lebih asam amino esensial, terutama lisin dan metionin. Namun, kombinasi beberapa \u003ca href=\"/blog/sumber-vegetarian-protein\">sumber protein nabati\u003c/a>, seperti kedelai dengan biji-bijian atau kacang polong dengan beras, bisa meningkatkan kualitas profil asam amino secara signifikan (Herreman et al., 2020).\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cstrong>Kedelai &amp; produk olahannya (tahu, tempe, atau susu kedelai). \u003c/strong>Satu-satunya protein nabati yang mendekati kualitas protein hewani secara keseluruhan.\u003c/li>\n\t\u003cli>\u003cstrong>Kacang-kacangan &amp; legum. \u003c/strong>&nbsp;Kaya serat dan protein, meski kandungan leusinnya lebih rendah dibandingkan whey.\u003c/li>\n\u003c/ul>\n\n\u003cp>Penelitian terkini menunjukkan bahwa 9 dari 12 studi yang membandingkan protein nabati dan hewani tidak menemukan perbedaan signifikan pada laju sintesis protein otot, dengan catatan jumlah dan kandungan BCAA yang dikonsumsi setara (Pinckaers et al., 2024).\u003c/p>\n\n\u003ch2>\u003cstrong>Kapan Harus Berkonsultasi ke Ahli Gizi atau Dokter?\u003c/strong>\u003c/h2>\n\n\u003cp>Kalkulator Protein memberi estimasi kebutuhan berdasarkan variabel umum. Konsultasi dengan tenaga profesional sangat dianjurkan bila Anda memiliki kondisi berikut.\u003c/p>\n\n\u003cul>\n\t\u003cli>Memiliki riwayat penyakit ginjal, hati, atau kondisi medis kronis lainnya.\u003c/li>\n\t\u003cli>Sedang dalam program diet yang sangat ketat dengan asupan kalori sangat rendah.\u003c/li>\n\t\u003cli>Sedang hamil atau menyusui, karena kebutuhan protein meningkat secara signifikan.\u003c/li>\n\t\u003cli>Mengalami penurunan massa otot yang tidak terduga meski asupan protein cukup.\u003c/li>\n\t\u003cli>Hasil kalkulator menunjukkan kebutuhan di atas 2,0 g/kg berat badan per hari, karena program intensitas tinggi ini sebaiknya dijalankan di bawah pengawasan profesional.\u003c/li>\n\u003c/ul>\n\n\u003cdiv style=\"background:#eeeeee;border:1px solid #cccccc;padding:5px 10px;\">\n\u003ch2>\u003cstrong>Disclaimer\u003c/strong>\u003c/h2>\n\n\u003cp>Hasil Kalkulator Protein bersifat \u003cstrong>informatif dan tidak menggantikan diagnosis atau saran medis\u003c/strong>. Gunakan hasil kalkulator ini sebagai panduan awal dan selalu konsultasikan program nutrisi Anda dengan tenaga profesional yang kompeten sebelum melakukan perubahan diet secara signifikan, terutama jika Anda memiliki kondisi kesehatan tertentu.\u003c/p>\n\u003c/div>\n\n\u003cp style=\"text-align:center\">&nbsp;\u003c/p>\n\n\u003cp>\u003cstrong>References:&nbsp;\u003c/strong>\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cem>Protein.\u003c/em> (2025). The Nutrition Source. Retrieved February 18, 2026, from https://nutritionsource.hsph.harvard.edu/what-should-you-eat/protein/&nbsp;\u003c/li>\n\t\u003cli>\u003cem>How much protein do you need every day?\u003c/em> (2023). Harvard Health. Retrieved February 18, 2026, from https://www.health.harvard.edu/blog/how-much-protein-do-you-need-every-day-201506188096\u003c/li>\n\t\u003cli>Trommelen, J., Holwerda, A. M., &amp; van Loon, L. J. C. (2024). Protein Intake Distribution: Beneficial, Detrimental, or Inconsequential for Muscle Anabolism? Response to Witard &amp; Mettler. \u003cem>International journal of sport nutrition and exercise metabolism, 34\u003c/em>(5), 325&ndash;328. https://doi.org/10.1123/ijsnem.2024-0107\u003c/li>\n\t\u003cli>Antonio, J., Evans, C., Ferrando, A. A., Stout, J. R., Antonio, B., Cinteo, H., Harty, P., Arent, S. M., Candow, D. G., Forbes, S. C., Kerksick, C. M., Pereira, F., Gonzalez, D., &amp; Kreider, R. B. (2024). Common questions and misconceptions about protein supplementation: what does the scientific evidence really show?. \u003cem>Journal of the International Society of Sports Nutrition, 21\u003c/em>(1), 2341903. https://doi.org/10.1080/15502783.2024.2341903\u003c/li>\n\t\u003cli>Herreman, L., Nommensen, P., Pennings, B., &amp; Laus, M. C. (2020). Comprehensive overview of the quality of plant- And animal-sourced proteins based on the digestible indispensable amino acid score.\u003cem> Food science &amp; nutrition, 8\u003c/em>(10), 5379&ndash;5391. https://doi.org/10.1002/fsn3.1809\u003c/li>\n\t\u003cli>Carbone, J. W., &amp; Pasiakos, S. M. (2019). Dietary Protein and Muscle Mass: Translating Science to Application and Health Benefit. \u003cem>Nutrients, 11\u003c/em>(5), 1136. https://doi.org/10.3390/nu11051136\u003c/li>\n\t\u003cli>Stokes, T., Hector, A. J., Morton, R. W., McGlory, C., &amp; Phillips, S. M. (2018). Recent Perspectives Regarding the Role of Dietary Protein for the Promotion of Muscle Hypertrophy with Resistance Exercise Training. \u003cem>Nutrients, 10\u003c/em>(2), 180. https://doi.org/10.3390/nu10020180\u003c/li>\n\t\u003cli>Devries, M. C., Sithamparapillai, A., Brimble, K. S., Banfield, L., Morton, R. W., &amp; Phillips, S. M. (2018). Changes in Kidney Function Do Not Differ between Healthy Adults Consuming Higher- Compared with Lower- or Normal-Protein Diets: A Systematic Review and Meta-Analysis. \u003cem>The Journal of nutrition, 148\u003c/em>(11), 1760&ndash;1775. https://doi.org/10.1093/jn/nxy197\u003c/li>\n\t\u003cli>Kamper, A. L., &amp; Strandgaard, S. (2017). Long-Term Effects of High-Protein Diets on Renal Function. \u003cem>Annual review of nutrition, 37\u003c/em>, 347&ndash;369. https://doi.org/10.1146/annurev-nutr-071714-034426\u003c/li>\n\u003c/ul>","min_app_version":null,"type":"math","category_id":1,"slug":"protein-calculator","formula_male":"(([weight] * [goal_adjustment_min] * [activity_level_min]) / 5) * 5","formula_female":null,"description":"Hitung kebutuhan protein harian sesuai kondisi tubuh dan tingkat aktivitas Anda","is_active":1},"health_faq":[{"id":48,"tool_id":2,"question":"Apa itu Kalkulator Protein?","answer":"Kalkulator Protein adalah alat bantu untuk memperkirakan kebutuhan protein harian berdasarkan berat badan, usia, jenis kelamin, tingkat aktivitas, dan tujuan kesehatan, di antaranya menjaga berat badan, menurunkan lemak, hingga meningkatkan massa otot. Gunakan kalkulator ini sebagai panduan awal sebelum konsultasi medis."},{"id":61,"tool_id":2,"question":"Apa itu protein?","answer":"Protein adalah zat gizi makro atau makronutrien yang dibutuhkan oleh tubuh untuk membangun dan memperbaiki jaringan, di antaranya otot, kulit, dan organ. Protein juga berperan dalam pembentukan enzim, hormon, dan antibodi yang mendukung sistem imun. \nAsupan protein harian yang cukup mampu membantu menjaga massa otot, mempercepat pemulihan setelah aktivitas fisik, dan meningkatkan rasa kenyang lebih lama."},{"id":62,"tool_id":2,"question":"Berapa kebutuhan protein harian orang dewasa?","answer":"Kebutuhan protein dasar orang dewasa umumnya sekitar 0,8 gram per kilogram berat badan per hari (Harvard Health, 2023). Meski demikian, kebutuhan akan meningkat menjadi 1,4–2,0 gram per kilogram berat badan bagi orang yang aktif berolahraga atau ingin membangun massa otot (Antonio et al., 2024)."},{"id":63,"tool_id":2,"question":"Apakah kekurangan atau kelebihan protein berbahaya?","answer":"Kekurangan protein dapat menyebabkan penurunan massa otot, daya tahan tubuh melemah, serta gangguan pertumbuhan pada anak. \nSebaliknya, konsumsi protein yang sangat tinggi dalam jangka panjang perlu diwaspadai, terlebih bagi orang dengan riwayat gangguan ginjal. Konsultasikan dengan tenaga medis untuk menentukan batas aman asupan protein Anda."},{"id":64,"tool_id":2,"question":"Sumber protein apa yang direkomendasikan?","answer":"Sumber protein dapat berasal dari hewani, seperti daging tanpa lemak, ikan, telur, dan susu, maupun nabati, seperti kacang-kacangan, tahu, tempe, dan biji-bijian. \nSelain dari makanan, protein juga bisa didapatkan dari suplemen gym, seperti whey protein. Whey adalah protein yang berasal dari susu dan mengandung asam amino esensial lengkap, termasuk BCAA yang mendukung pemulihan dan pertumbuhan otot setelah latihan."},{"id":65,"tool_id":2,"question":"Bagaimana cara membagi asupan protein dalam sehari?","answer":"Untuk hasil optimal, distribusikan asupan protein secara merata dalam 3–4 waktu makan. Setiap waktu makan mampu menyumbang sekitar 20–40 gram protein, tergantung kebutuhan protein harian Anda. \nPola ini dapat membantu mendukung sintesis protein otot secara lebih efektif. Gunakan Kalkulator Protein untuk mengetahui kebutuhan protein harian Anda secara personal."},{"id":82,"tool_id":2,"question":"Referensi","answer":"(1) Protein. (2025). The Nutrition Source. Retrieved February 18, 2026, from https://nutritionsource.hsph.harvard.edu/what-should-you-eat/protein/ | (2) How much protein do you need every day? (2023). Harvard Health. Retrieved February 18, 2026, from https://www.health.harvard.edu/blog/how-much-protein-do-you-need-every-day-201506188096 | (3) Antonio, J., Evans, C., Ferrando, A. A., Stout, J. R., Antonio, B., Cinteo, H., Harty, P., Arent, S. M., Candow, D. G., Forbes, S. C., Kerksick, C. M., Pereira, F., Gonzalez, D., & Kreider, R. B. (2024). Common questions and misconceptions about protein supplementation: what does the scientific evidence really show?. Journal of the International Society of Sports Nutrition, 21(1), 2341903. https://doi.org/10.1080/15502783.2024.2341903"}],"health_questions":[{"step":1,"questions":[{"id":7,"tool_id":2,"step":1,"sequence":1,"variable_name":"name","validate":"required|string|min:3|max:255","question_text":"Siapa nama Anda?","question_image":null,"description":null,"input_type":"text","is_gender_specific":"0","suffix":null,"default":null,"health_questions_options":[]},{"id":8,"tool_id":2,"step":1,"sequence":2,"variable_name":"gender","validate":"required|integer|in:1,2","question_text":"Apa jenis kelamin Anda?","question_image":null,"description":"*Diperlukan untuk hasil yang lebih akurat","input_type":"radioimage","is_gender_specific":"0","suffix":null,"default":null,"health_questions_options":[{"id":11,"question_id":8,"option_label":"Laki-laki","image":"/_media/cdn/uploads/imagestorage/male-icon-37-1769143069.png","score_value":"1"},{"id":12,"question_id":8,"option_label":"Perempuan","i
