<body class="w-site"><div id="site-header"></div><main id="site-main"><div class="w-legacy-app"><div data-server-rendered="true" id="__nuxt"></div></div><div class="w-container w-live-slot" data-live-catalog=""></div></main><script>window.__NUXT__={"layout":"default","data":[{"detailHealthTool":{"health_tools":{"id":14,"name":"Grafik Pertumbuhan Anak","title":"Grafik Pertumbuhan Anak","image":"/_media/cdn/uploads/imagestorage/banner-growth-kids-30-1790071901.png","icon":"/_media/cdn/uploads/imagestorage/icon-growth-chart-52-1790057219.png","color":"#E0EFFF\n","meta_title":"Grafik Pertumbuhan Anak │ Kalkulator BB & TB Standar WHO","meta_description":"Pantau tumbuh kembang si Kecil dengan Grafik Pertumbuhan Anak berbasis standar WHO. Cek berat & tinggi badan anak gratis, akurat, dan mudah dipahami.","footer_content":"\u003ch2>\u003cstrong>Tentang Grafik Pertumbuhan Anak\u003c/strong>\u003c/h2>\n\n\u003cp>Grafik Pertumbuhan Anak adalah alat skrining digital yang menggunakan standar \u003cstrong>WHO Growth Standards (2006)\u003c/strong>, yakni baku acuan pertumbuhan anak yang ditetapkan Organisasi Kesehatan Dunia berdasarkan studi longitudinal di enam negara selama 20 tahun.&nbsp;\u003c/p>\n\n\u003cp>Alat ini menghitung empat indikator Z-score sekaligus: BB/U (berat badan menurut umur), TB/U (tinggi badan menurut umur), BB/TB (berat badan menurut tinggi badan), dan IMT/U (indeks massa tubuh menurut umur).&nbsp;\u003c/p>\n\n\u003cp>Dari keempat indikator tersebut, alat ini mengevaluasi apakah pertumbuhan anak berada dalam rentang normal, memerlukan perhatian, atau perlu segera dikonsultasikan ke tenaga kesehatan.\u003c/p>\n\n\u003ch2>\u003cstrong>Mengapa Pemantauan Tumbuh Kembang Anak Penting?\u003c/strong>\u003c/h2>\n\n\u003cp>Survei Kesehatan Indonesia (SKI) 2023 yang dirilis Kementerian Kesehatan RI menyebut angka persentase stunting nasional berada di 21,5 persen. Itu artinya, lebih dari satu dari lima balita di Indonesia memiliki tinggi badan di bawah standar usianya.&nbsp;\u003c/p>\n\n\u003cp>\u003ca href=\"/blog/dampak-stunting-pada-anak\">Stunting pada anak\u003c/a> tidak hanya berdampak pada fisik, tetapi juga pada perkembangan kognitif hingga kualitas hidup anak di masa dewasa. Karena itu, deteksi dini menjadi kunci penting.\u003c/p>\n\n\u003cp>Gangguan pertumbuhan anak yang diketahui sebelum usia 2 tahun, yang masuk dalam periode 1.000 Hari Pertama Kehidupan (HPK), jauh lebih dapat ditangani daripada yang baru terdeteksi saat usia pra-sekolah. Sayangnya, banyak orang tua baru menyadari adanya masalah ketika anak sudah menunjukkan gejala yang lebih jelas.\u003c/p>\n\n\u003ch3>\u003cstrong>Klasifikasi Status Pertumbuhan Anak Menurut WHO Growth Standards\u003c/strong>\u003c/h3>\n\n\u003cp>Berikut ini adalah ringkasan klasifikasi Z-score untuk dua indikator utama yang paling umumnya menjadi perhatian orang tua.\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:97px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Indikator\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:150px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Z-score\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:191px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Klasifikasi WHO\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:186px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Status\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd rowspan=\"3\" style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:97px\">\n\t\t\t\u003cp>TB/U (Tinggi Badan)\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:150px\">\n\t\t\t\u003cp style=\"text-align:center\">&lt; &minus;3 SD\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:191px\">\n\t\t\t\u003cp>Sangat Pendek\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:186px\">\n\t\t\t\u003cp>Konsultasi Sekarang\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:97px\">\n\t\t\t\u003cp style=\"text-align:center\">&minus;3 SD s.d. &lt; &minus;2 SD\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:150px\">\n\t\t\t\u003cp>Pendek\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:191px\">\n\t\t\t\u003cp>Perlu Perhatian\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:97px\">\n\t\t\t\u003cp style=\"text-align:center\">&ge; &minus;2 SD&nbsp;\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:150px\">\n\t\t\t\u003cp>Normal\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:191px\">\n\t\t\t\u003cp>Normal\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd rowspan=\"5\" style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:97px\">\n\t\t\t\u003cp>BB/U (Berat Badan)\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:150px\">\n\t\t\t\u003cp style=\"text-align:center\">&lt; &minus;3 SD\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:191px\">\n\t\t\t\u003cp>Sangat Kurang\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:186px\">\n\t\t\t\u003cp>Konsultasi Sekarang\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:97px\">\n\t\t\t\u003cp style=\"text-align:center\">&minus;3 SD s.d. &lt; &minus;2 SD\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:150px\">\n\t\t\t\u003cp>Kurang (Underweight)\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:191px\">\n\t\t\t\u003cp>Perlu Perhatian\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:97px\">\n\t\t\t\u003cp style=\"text-align:center\">&minus;2 SD s.d. +1 SD\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:150px\">\n\t\t\t\u003cp>Normal\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:191px\">\n\t\t\t\u003cp>Normal\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:97px\">\n\t\t\t\u003cp style=\"text-align:center\">+1 SD s.d. +2 SD\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:150px\">\n\t\t\t\u003cp>Berisiko Berat Lebih\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:191px\">\n\t\t\t\u003cp>Perhatikan Pola Makan\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:97px\">\n\t\t\t\u003cp style=\"text-align:center\">&gt; +2 SD&nbsp;\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:150px\">\n\t\t\t\u003cp>Berat Lebih (Obesitas)\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:191px\">\n\t\t\t\u003cp>Perlu Perhatian\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003cp>Untuk indikator BB/TB dan IMT/U, klasifikasi mengikuti pola serupa dengan tambahan kategori Gemuk dan Sangat Gemuk di ujung atas spektrum.\u003c/p>\n\n\u003ch2>\u003cstrong>Memahami Hasil Grafik Pertumbuhan Anak\u003c/strong>\u003c/h2>\n\n\u003cp>Grafik Pertumbuhan Anak menghasilkan satu dari empat status keseluruhan, yang ditentukan berdasarkan indikator dengan kondisi terburuk dari keempat Z-score yang dihitung.\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cstrong>Normal:\u003c/strong> berarti semua indikator berada dalam rentang yang diharapkan untuk usia dan jenis kelamin anak. Tugas Anda adalah mempertahankan pola asuh serta nutrisi yang sudah berjalan dengan baik.\u003c/li>\n\t\u003cli>\u003cstrong>Perhatikan Pola Makan: \u003c/strong>muncul ketika indikator berat badan (IMT) mulai menunjukkan kecenderungan berlebih, meski \u003ca href=\"/blog/vitamin-peninggi-badan-anak\">tinggi badan anak\u003c/a> masih normal. Ini adalah sinyal awal yang memberi ruang untuk perubahan sebelum terjadi masalah yang lebih kompleks.\u003c/li>\n\t\u003cli>\u003cstrong>Perlu Perhatian:\u003c/strong> menandakan satu atau lebih indikator berada di luar rentang normal, baik karena terlalu rendah (\u003cem>underweight\u003c/em>, \u003cem>stunting\u003c/em>) maupun terlalu tinggi (\u003cem>overweight\u003c/em>). Butuh evaluasi pola makan, konsultasi awal ke dokter, dan pemantauan lebih ketat.\u003c/li>\n\t\u003cli>\u003cstrong>Konsultasi Sekarang:\u003c/strong> muncul saat ada indikator, baik itu tinggi atau \u003ca href=\"/blog/berat-badan-ideal-anak\">berat badan anak\u003c/a>, yang berada jauh di luar rentang aman. Ini jadi sinyal serius bahwa anak membutuhkan evaluasi tenaga kesehatan yang tidak dapat ditunda.\u003c/li>\n\u003c/ul>\n\n\u003ch3>\u003cstrong>Kapan Harus Berkonsultasi dengan Tenaga Kesehatan?\u003c/strong>\u003c/h3>\n\n\u003cp>Segera konsultasikan kondisi anak ke dokter anak, bidan, atau ahli gizi anak bila muncul tanda dan gejala berikut ini.\u003c/p>\n\n\u003cul>\n\t\u003cli>Hasil skrining menunjukkan status Konsultasi Sekarang.\u003c/li>\n\t\u003cli>Berat badan anak tidak naik selama dua bulan berturut-turut.\u003c/li>\n\t\u003cli>Tinggi badan anak tampak jauh lebih pendek dibandingkan teman seusianya.\u003c/li>\n\t\u003cli>Berat badan anak turun secara tiba-tiba tanpa penyebab yang jelas.\u003c/li>\n\t\u003cli>\u003ca href=\"/blog/cara-mengatasi-anak-susah-makan\">Anak susah makan\u003c/a> atau menolak makan lebih dari dua minggu.\u003c/li>\n\u003c/ul>\n\n\u003ch2>\u003cstrong>Tips Memantau dan Mendukung Tumbuh Kembang Anak\u003c/strong>\u003c/h2>\n\n\u003cp>Selain menggunakan Grafik Pertumbuhan Anak, langkah-langkah berbasis panduan WHO dan Kemenkes di bawah ini dapat membantu orang tua mendukung tumbuh kembang si Kecil.\u003c/p>\n\n\u003ch3>\u003cstrong>1. Timbang dan Ukur secara Rutin\u003c/strong>\u003c/h3>\n\n\u003cp>Berat dan tinggi badan anak sebaiknya diukur setiap bulan hingga usia 1 tahun dan setiap tiga bulan hingga usia 2 tahun. Setelahnya, lakukan pengukuran setiap enam bulan hingga usia 6 tahun dan setahun sekali pada usia di atasnya. Anda bisa melakukan pengukuran mandiri di rumah atau dengan pengawasan tenaga kesehatan di posyandu.\u003c/p>\n\n\u003ch3>\u003cstrong>2. Penuhi Gizi Seimbang sejak Dini\u003c/strong>\u003c/h3>\n\n\u003cp>ASI eksklusif selama enam bulan pertama, dilanjutkan MPASI bergizi setelah usia enam bulan, merupakan fondasi pertumbuhan yang sehat. Variasikan protein hewani (ikan, telur, daging, unggas) dan protein nabati (tahu, tempe, kacang-kacangan) dalam menu harian anak.\u003c/p>\n\n\u003ch3>\u003cstrong>3. Pastikan Asupan Zat Gizi Mikro Terpenuhi\u003c/strong>\u003c/h3>\n\n\u003cp>Kekurangan zinc, zat besi, vitamin D, dan kalsium merupakan penyebab paling umum masalah pertumbuhan pada anak. Jika asupan mikronutrien dari makanan diragukan, bicarakan dengan dokter anak mengenai suplemen yang sesuai usia dan kondisi \u003ca href=\"/blog/kesehatan-anak\">kesehatan anak\u003c/a>.\u003c/p>\n\n\u003ch3>\u003cstrong>4. Berikan Stimulasi Lengkap\u003c/strong>\u003c/h3>\n\n\u003cp>Tumbuh kembang anak mencakup aspek motorik, kognitif, dan sosial-emosional. Bermain aktif, membaca bersama, dan interaksi yang hangat dengan orang tua memastikan stimulasi lengkap yang akan membantu mendukung perkembangan otak yang optimal.\u003c/p>\n\n\u003ch3>\u003cstrong>5. Jaga Jadwal Imunisasi\u003c/strong>\u003c/h3>\n\n\u003cp>Penyakit infeksi yang berulang menjadi salah satu faktor yang paling sering mengganggu grafik pertumbuhan anak. \u003ca href=\"/blog/imunisasi-anak\">Imunisasi\u003c/a> sesuai jadwal Ikatan Dokter Anak Indonesia (IDAI) melindungi si Kecil dari kemungkinan terkena penyakit yang dapat menghambat penyerapan nutrisi.\u003c/p>\n\n\u003cdiv style=\"background:#eeeeee;border:1px solid #cccccc;padding:5px 10px;\">\n\u003ch2>\u003cstrong>Disclaimer\u003c/strong>\u003c/h2>\n\n\u003cp>Hasil Grafik Pertumbuhan Anak bersifat \u003cstrong>informatif dan tidak menggantikan pemeriksaan medis\u003c/strong>. Diagnosis \u003cem>stunting\u003c/em>, \u003cem>underweight\u003c/em>, atau gangguan pertumbuhan lainnya hanya dapat ditegakkan oleh tenaga kesehatan setelah pemeriksaan menyeluruh.\u003c/p>\n\u003c/div>\n\n\u003cp>&nbsp;\u003c/p>\n\n\u003cp>\u003cstrong>References:&nbsp;\u003c/strong>\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cem>WHO child growth standards: Length/height-for-age, weight-for-age, weight-for-length, weight-for-height and body mass index-for-age: methods and development.\u003c/em> (2006). World Health Organization. Retrieved July 9, 2026, from https://www.who.int/publications/i/item/924154693X\u003c/li>\n\t\u003cli>\u003cem>Survei Kesehatan Indonesia (SKI) 2023. \u003c/em>(2024). Kementerian Kesehatan Republik Indonesia. Retrieved July 9, 2026, from https://kemkes.go.id/id/survei-kesehatan-indonesia-ski-2023\u003c/li>\n\t\u003cli>\u003cem>Pentingnya Memantau Pertumbuhan Dan Perkembangan Anak (Bagian 1).\u003c/em> (2016). Ikatan Dokter Anak Indonesia. Retrieved July 9, 2026, from https://www.idai.or.id/artikel/seputar-kesehatan-anak/pentingnya-memantau-pertumbuhan-dan-perkembangan-anak-bagian-1\u003c/li>\n\t\u003cli>\u003cem>Jadwal Imunisasi Anak Usia 0-18 Tahun, Rekomendasi Ikatan Dokter Anak Indonesia tahun 2024.\u003c/em> (2016). Ikatan Dokter Anak Indonesia. Retrieved July 9, 2026, from https://www.idai.or.id/professional-resources/rekomendasi/jadwal-imunisasi-anak-usia-0-18-tahun\u003c/li>\n\t\u003cli>Mulyani, A. T., Khairinisa, M. A., Khatib, A., &amp; Chaerunisaa, A. Y. (2025). Understanding Stunting: Impact, Causes, and Strategy to Accelerate Stunting Reduction-A Narrative Review. \u003cem>Nutrients, 17\u003c/em>(9), 1493. https://doi.org/10.3390/nu17091493\u003c/li>\n\t\u003cli>Zhang, X., Liu, J., Ni, Y., Yi, C., Fang, Y., Ning, Q., Shen, B., Zhang, K., Liu, Y., Yang, L., Li, K., Liu, Y., Huang, R., &amp; Li, Z. (2024). Global Prevalence of Overweight and Obesity in Children and Adolescents: A Systematic Review and Meta-Analysis. \u003cem>JAMA pediatrics, 178\u003c/em>(8), 800&ndash;813. https://doi.org/10.1001/jamapediatrics.2024.1576\u003c/li>\n\u003c/ul>","min_app_version":"1.3.39","type":"math","category_id":3,"slug":"grafik-pertumbuhan-anak","formula_male":null,"formula_female":null,"description":"Pantau tumbuh kembang anak berdasarkan usia, tinggi badan, dan berat badan","is_active":1},"health_faq":[{"id":138,"tool_id":14,"question":"Apa itu Grafik Pertumbuhan Anak?","answer":"Grafik Pertumbuhan Anak adalah alat digital yang membantu orang tua memantau apakah berat dan tinggi badan si Kecil sudah sesuai usianya dengan standar WHO Growth Standards (2006). Hasil dari alat ini membantu mendeteksi dini risiko masalah tumbuh kembang, seperti stunting atau underweight, sebelum berkembang menjadi masalah klinis yang lebih serius."},{"id":139,"tool_id":14,"question":"Seberapa akurat hasil Grafik Pertumbuhan Anak?","answer":"Akurasi hasil sangat bergantung pada ketelitian Anda saat mengukur berat dan tinggi badan anak. Untuk anak di bawah 24 bulan, pastikan pengukuran dilakukan dalam posisi berbaring; anak di atas 24 bulan diukur dalam posisi berdiri tegak."},{"id":140,"tool_id":14,"question":"Siapa yang bisa menggunakan Grafik Pertumbuhan Anak?","answer":"Alat ini ditujukan untuk orang tua, pengasuh, atau siapa pun yang ingin memantau tumbuh kembang anak usia 0–5 tahun. Cukup menyiapkan tanggal lahir, jenis kelamin, serta hasil pengukuran berat badan (kg) dan tinggi atau panjang badan (cm) anak."},{"id":141,"tool_id":14,"question":"Apakah hasil ini bisa digunakan sebagai diagnosis medis?","answer":"Tidak. Grafik Pertumbuhan Anak adalah alat skrining awal, bukan alat diagnosis. Hasil yang ditampilkan, termasuk Normal, Perlu Perhatian, Perhatikan Pola makan, atau Konsultasi Sekarang, bersifat informatif dan tidak menggantikan pemeriksaan oleh dokter spesialis anak."},{"id":142,"tool_id":14,"question":"Bagaimana cara membaca hasil Grafik Pertumbuhan Anak?","answer":"Setelah memasukkan data, sistem menampilkan empat nilai Z-score beserta status masing-masing indikator. Z-score antara −2 SD s.d.+2 SD biasanya berarti Normal. Status keseluruhan akan ditentukan dari indikator dengan kondisi terburuk: jika ada satu indikator yang Perlu Perhatian, status akhir anak ikut menjadi Perlu Perhatian. Semakin jauh Z-score dari nol, semakin perlu tindak lanjut."},{"id":143,"tool_id":14,"question":"Mengapa penting memantau Grafik Pertumbuhan Anak?","answer":"Gangguan pertumbuhan seperti stunting atau underweight sering tidak terlihat jelas di awal. Dengan memantau grafik pertumbuhan anak tiap bulan, Anda akan mendeteksi perubahan lebih awal sehingga langkah penanganan lebih efektif. WHO merekomendasikan pemantauan rutin sebagai bagian dari perawatan kesehatan anak usia dini."},{"id":144,"tool_id":14,"question":"Referensi","answer":"Growth Charts. (2024). US Centers for Disease Control and Prevention. Retrieved July 9, 2026, from https://www.cdc.gov/growthcharts/index.htm\nWHO child growth standards: Length/height-for-age, weight-for-age, weight-for-length, weight-for-height and body mass index-for-age: methods and development. (2006). World Health Organization. Retrieved July 9, 2026, from https://www.who.int/publications/i/item/924154693X\nPentingnya Memantau Pertumbuhan Dan Perkembangan Anak (Bagian 1). (2016). Ikatan Dokter Anak Indonesia. Retrieved July 9, 2026, from https://www.idai.or.id/artikel/seputar-kesehatan-anak/pentingnya-memantau-pertumbuhan-dan-perkembangan-anak-bagian-1"}],"health_questions":[{"step":1,"questions":[{"id":108,"tool_id":14,"step":1,"sequence":1,"variable_name":"name","validate":"required|string|min:3|max:255","question_text":"Siapa nama anak Anda?","question_image":null,"description":null,"input_type":"text","is_gender_specific":"0","suffix":null,"default":null,"health_questions_options":[]},{"id":109,"tool_id":14,"step":1,"sequence":2,"variable_name":"birthdate","validate":"re
