a9.ico" rel="icon" type="image/x-icon"/><link data-n-head="ssr" href="/assets/1071dc0e93d26fbbc52fadb5.png" rel="icon" sizes="96x96" type="image/png"/><link data-n-head="ssr" href="/assets/a561b10bfaef5c342318dfe0.png" rel="apple-touch-icon" sizes="180x180"/><link href="/assets/6cf4aff216c7a147185e50ae.css" rel="stylesheet"/>

<body class="w-site"><div id="site-header"></div><main id="site-main"><div class="w-legacy-app"><div data-server-rendered="true" id="__nuxt"></div></div><div class="w-container w-live-slot" data-live-catalog=""></div></main><script>window.__NUXT__={"layout":"default","data":[{"detailHealthTool":{"health_tools":{"id":6,"name":"Skrining Pre-Diabetes","title":"Skrining Pre-Diabetes","image":"/_media/cdn/uploads/imagestorage/banner-pre-diabetes-62-1769585266.png","icon":"/_media/cdn/uploads/imagestorage/icon-diabetes-29-1769050157.png","color":"#FFE0E1","meta_title":"Skrining Pre-Diabetes │ Cek Risiko Diabetes Online","meta_description":"Lakukan Skrining Pre-Diabetes online dan ketahui risiko Anda sejak dini. Cegah diabetes tipe 2 dengan langkah yang tepat. Mulai cek sekarang!","footer_content":"\u003ch2>\u003cstrong>Tentang Skrining Pre-Diabetes\u003c/strong>\u003c/h2>\n\n\u003cp>Skrining Pre-Diabetes adalah alat bantu khusus yang dirancang untuk menilai risiko seseorang mengalami gangguan metabolisme gula darah sebelum berkembang menjadi \u003ca href=\"/blog/diabetes-melitus-tipe-2-gejala-dan-faktor-penyebab\">diabetes tipe 2\u003c/a>.\u003c/p>\n\n\u003cp>Pertanyaan yang diajukan dalam skrining ini mengevaluasi beberapa komponen, termasuk usia, jenis kelamin, indeks massa tubuh (IMT), tingkat aktivitas fisik harian, tekanan darah tinggi, dan riwayat diabetes dalam keluarga. Kombinasi faktor-faktor ini menghasilkan skor risiko untuk menentukan apakah seseorang perlu melakukan pemeriksaan lebih lanjut.\u003c/p>\n\n\u003cp>Penting untuk diingat bahwa hasil skrining ini bukan diagnosis medis. Skrining hanya berfungsi sebagai langkah awal deteksi risiko \u003ca href=\"/blog/diabetes\">penyakit diabetes\u003c/a>. Konfirmasi diagnosis tetap memerlukan pemeriksaan klinis oleh tenaga kesehatan.\u003c/p>\n\n\u003ch2>\u003cstrong>Mengapa Pre-Diabetes Penting untuk Dideteksi Dini?\u003c/strong>\u003c/h2>\n\n\u003cp>Pre-diabetes adalah kondisi saat kadar gula darah berada di atas normal, tetapi belum masuk kategori diabetes. Kondisi ini sering tidak menunjukkan gejala, sehingga mudah terlewat dan bisa berkembang serius dari waktu ke waktu.&nbsp;\u003c/p>\n\n\u003cp>Menurut data Riset Kesehatan Dasar (Riskesdas) di tahun 2018, menunjukkan bahwa 41,2% dari populasi umum yang diperiksa dengan Modified FINDRISC mengalami pre-diabetes dan memerlukan konfirmasi tes lanjutan untuk kondisi terkait (Cahyaningsih et al., 2025).\u003c/p>\n\n\u003ch3>\u003cstrong>Dampak Kesehatan Pre-Diabetes yang Tidak Ditangani\u003c/strong>\u003c/h3>\n\n\u003cp>Tanpa penanganan, pengidap pre-diabetes berisiko mengalami komplikasi serius di bawah ini.\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:136px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Komplikasi\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:488px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Keterangan\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:136px\">\n\t\t\t\u003cp>Diabetes tipe 2\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:488px\">\n\t\t\t\u003cp>Pre-diabetes bisa berkembang jadi diabetes tipe 2. Pada orang dengan IGT (\u003cem>Impaired Glucose Tolerance\u003c/em>) dan IFG (\u003cem>Impaired Fasting Glucose\u003c/em>), risikonya dapat mencapai 50% dalam 5 tahun (Fujiati et al., 2017).\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:136px\">\n\t\t\t\u003cp>Penyakit kardiovaskular\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:488px\">\n\t\t\t\u003cp>Pre-diabetes dapat meningkatkan risiko penyakit kardiovaskular, seperti penyakit jantung dan stroke. Risikonya hampir 2 kali lipat dibandingkan orang dengan kadar gula darah normal (Huang et al., 2016).\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:136px\">\n\t\t\t\u003cp>Kerusakan ginjal\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:488px\">\n\t\t\t\u003cp>Pre-diabetes, terutama ketika disertai penumpukan lemak di area perut, berkaitan dengan peningkatan risiko nefropati atau kerusakan ginjal.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:136px\">\n\t\t\t\u003cp>Kerusakan saraf dan retina\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:488px\">\n\t\t\t\u003cp>Komplikasi pada pembuluh darah kecil yang dapat memengaruhi saraf dan retina mulai berkembang sejak fase pre-diabetes. Komplikasi tidak selalu menunggu sampai diabetes terdiagnosis (Wang et al., 2025).\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003cp>\u003cem>*) Sumber: Fujiati et al. (2017); Huang et al. (2016); Wang et al. (2025).\u003c/em>\u003c/p>\n\n\u003ch2>\u003cstrong>Mengenali Tingkat Risiko Pre-Diabetes\u003c/strong>\u003c/h2>\n\n\u003cp>Skor dari Skrining Pre-Diabetes membantu mengklasifikasikan risiko seseorang ke dalam dua kategori utama, yakni Risiko Rendah dan Risiko Tinggi.\u003c/p>\n\n\u003ch3>\u003cstrong>1. Risiko Rendah (Skor 0&ndash;4)\u003c/strong>\u003c/h3>\n\n\u003cp>Orang pada kelompok ini memiliki profil metabolik yang relatif baik. Faktor risiko, seperti berat badan dan aktivitas fisik masih dalam rentang yang sehat.&nbsp;\u003c/p>\n\n\u003cp>Meski demikian, risiko bisa meningkat seiring waktu jika gaya hidup tidak dijaga. Kelompok ini dianjurkan untuk tetap melakukan skrining ulang secara berkala, setiap 1&ndash;3 tahun.\u003c/p>\n\n\u003ch3>\u003cstrong>2. Risiko Tinggi (Skor 5&ndash;11)\u003c/strong>\u003c/h3>\n\n\u003cp>Orang pada kelompok ini punya kombinasi beberapa faktor risiko signifikan. Studi menunjukkan bahwa peningkatan skor IMT secara progresif berkorelasi langsung dengan peningkatan risiko pre-diabetes (Lin et al., 2026).&nbsp;\u003c/p>\n\n\u003cp>Kelompok ini sangat dianjurkan untuk segera melakukan pemeriksaan laboratorium untuk dapat memastikan ada tidaknya \u003ca href=\"/diseases/diabetes\">diabetes\u003c/a> di bawah pengawasan tenaga kesehatan.\u003c/p>\n\n\u003ch2>\u003cstrong>Kapan Harus Segera Berkonsultasi dengan Dokter?\u003c/strong>\u003c/h2>\n\n\u003cp>Terlepas dari hasil skor skrining, segera temui tenaga kesehatan jika Anda mengalami satu atau lebih kondisi berikut ini.\u003c/p>\n\n\u003cul>\n\t\u003cli>Sering merasa haus berlebihan atau buang air kecil lebih dari biasanya.\u003c/li>\n\t\u003cli>Penglihatan tiba-tiba kabur tanpa sebab yang jelas.\u003c/li>\n\t\u003cli>Luka yang sulit sembuh atau sering mengalami infeksi berulang.\u003c/li>\n\t\u003cli>Kelelahan ekstrem yang tidak membaik meski sudah cukup istirahat.\u003c/li>\n\t\u003cli>Memiliki riwayat diabetes gestasional atau bayi lahir dengan berat di atas 4 kilogram.\u003c/li>\n\t\u003cli>Memiliki anggota keluarga dekat (orang tua atau saudara kandung) yang didiagnosis diabetes sebelum usia 50 tahun.\u003c/li>\n\t\u003cli>Tekanan darah sistolik &ge;140 mmHg yang tidak terkontrol.\u003c/li>\n\u003c/ul>\n\n\u003ch2>\u003cstrong>Langkah Pencegahan Pre-Diabetes\u003c/strong>\u003c/h2>\n\n\u003cp>Kabar baiknya, pre-diabetes mungkin dicegah dan bahkan dibalik ke \u003ca href=\"/blog/kadar-gula-darah-normal\">kondisi gula darah normal\u003c/a> (normoglikemia). Bukti ilmiah mendukung beberapa strategi utama seperti di bawah ini.\u003c/p>\n\n\u003ch3>\u003cstrong>1. Turunkan Berat Badan secara Bertahap\u003c/strong>\u003c/h3>\n\n\u003cp>Program pencegahan diabetes (Diabetes Prevention Program/DPP) yang dikembangkan CDC menetapkan target penurunan berat badan sebesar 5&ndash;7% dari berat awal disertai aktivitas fisik minimal 150 menit per minggu.&nbsp;\u003c/p>\n\n\u003cp>Kombinasi ini terbukti mampu menurunkan risiko berkembangnya diabetes tipe 2, sampai 58% pada individu berisiko tinggi (Fujiati et al., 2017).\u003c/p>\n\n\u003ch3>\u003cstrong>2. Tingkatkan Aktivitas Fisik\u003c/strong>\u003c/h3>\n\n\u003cp>Aktivitas fisik meningkatkan sensitivitas insulin serta mendorong penyerapan glukosa oleh otot. Studi menunjukkan bahwa melakukan aktivitas fisik lebih dari 150 menit per minggu membantu meningkatkan peluang pemulihan ke normoglikemia sebesar 4,15 kali lipat dibandingkan individu yang tidak aktif (Rivera-Martinez et al., 2025).&nbsp;\u003c/p>\n\n\u003cp>Jenis olahraga untuk \u003ca href=\"/blog/kenali-gejala-gula-darah-tinggi\">gula darah tinggi\u003c/a> yang direkomendasikan adalah kombinasi aerobik (jalan cepat, bersepeda, berenang) dan latihan kekuatan (\u003cem>resistance training\u003c/em>) 3&ndash;4 kali per minggu.\u003c/p>\n\n\u003ch3>\u003cstrong>3. Terapkan Pola Makan Rendah Karbohidrat Olahan\u003c/strong>\u003c/h3>\n\n\u003cp>Pola makan yang membatasi gula tambahan dan karbohidrat olahan sebagai dasar manajemen pre-diabetes. Diet Mediterania yang kaya sayuran, ikan, hingga lemak tak jenuh meningkatkan sensitivitas insulin dan mendukung pemulihan kadar gula darah (Rondanelli et al., 2023).&nbsp;\u003c/p>\n\n\u003cp>Selain itu, Anda juga harus membatasi konsumsi minuman manis, nasi putih berlebihan, tepung terigu, serta makanan olahan yang tinggi gula.\u003c/p>\n\n\u003ch3>\u003cstrong>4. Pantau Lingkar Pinggang Berkala\u003c/strong>\u003c/h3>\n\n\u003cp>Peningkatan progresif pada indeks massa tubuh (IMT) dan lingkar pinggang berkaitan langsung dengan meningkatnya risiko pre-diabetes (Lin et al., 2026). Rekomendasi WHO untuk Asia Pasifik menetapkan batas lingkar pinggang pada pria &ge;90 cm dan wanita &ge;80 cm.\u003c/p>\n\n\u003ch3>\u003cstrong>5. Kelola Stres dan Kualitas Tidur\u003c/strong>\u003c/h3>\n\n\u003cp>Tidur yang tidak cukup atau berkualitas buruk berisiko mengganggu keseimbangan energi serta menyebabkan peningkatan rasa lapar serta penurunan pengeluaran energi, yang pada akhirnya memperburuk resistensi insulin (Rondanelli et al., 2023).&nbsp;\u003c/p>\n\n\u003cp>Targetkan tidur 7&ndash;9 jam per malam dengan jadwal yang konsisten. Terapkan \u003ca href=\"/blog/sleep-hygiene\">\u003cem>sleep hygiene\u003c/em>\u003c/a>\u003cem> \u003c/em>atau kebiasaan tidur yang baik, seperti hindari bermain \u003cem>gadget \u003c/em>30&ndash;60 menit menjelang tidur, jadikan kamar tidur menjadi gelap dan sejuk, serta lakukan relaksasi sebelum tidur.\u003c/p>\n\n\u003cdiv style=\"background:#eeeeee;border:1px solid #cccccc;padding:5px 10px;\">\n\u003ch2>\u003cstrong>Disclaimer\u003c/strong>\u003c/h2>\n\n\u003cp>Hasil Skrining Pre-Diabetes ini bersifat \u003cstrong>informatif dan tidak menggantikan diagnosis atau saran medis\u003c/strong>. Jika memiliki kekhawatiran mengenai kadar gula darah atau kondisi kesehatan Anda maupun orang terdekat, konsultasikan dengan dokter untuk pemeriksaan lebih lanjut.\u003c/p>\n\u003c/div>\n\n\u003cp style=\"text-align:center\">&nbsp;\u003c/p>\n\n\u003cp>\u003cstrong>References:&nbsp;\u003c/strong>\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cem>Pre-diabetes.\u003c/em> (2025). Harvard Health. Retrieved February 18, 2026, from https://www.health.harvard.edu/diseases-and-conditions/pre-diabetes-a-to-z\u003c/li>\n\t\u003cli>\u003cem>Diabetes prevention: 5 tips for taking control. \u003c/em>(2024). Mayo Clinic. Retrieved February 18, 2026, from https://www.mayoclinic.org/diseases-conditions/type-2-diabetes/in-depth/diabetes-prevention/art-20047639\u003c/li>\n\t\u003cli>Abe, M., Fujii, H., Funakoshi, S., Satoh, A., Kawazoe, M., Maeda, T., Tada, K., Yokota, S., Yamanokuchi, T., Yoshimura, C., Mimata, R., Takahashi, K., Ito, K., Yasuno, T., Kuga, T., Mukoubara, S., Akiyoshi, K., Kawanami, D., Masutani, K., &amp; Arima, H. (2021). Comparison of Body Mass Index and Waist Circumference in the Prediction of Diabetes: A Retrospective Longitudinal Study. \u003cem>Diabetes therapy : research, treatment and education of diabetes and related disorders, 12\u003c/em>(10), 2663&ndash;2676. https://doi.org/10.1007/s13300-021-01138-3\u003c/li>\n\t\u003cli>Wang, Y., Chai, X., Wang, Y., Yin, X., Huang, X., Gong, Q., Zhang, J., Shao, R., &amp; Li, G. (2025). Effectiveness of Different Intervention Modes in Lifestyle Intervention for the Prevention of Type 2 Diabetes and the Reversion to Normoglycemia in Adults With Prediabetes: Systematic Review and Meta-Analysis of Randomized Controlled Trials. \u003cem>Journal of medical Internet research, 27\u003c/em>, e63975. https://doi.org/10.2196/63975\u003c/li>\n\t\u003cli>Rivera-Mart&iacute;nez, W. A., Salazar-Solarte, A. M., S&aacute;nchez-Machado, D. M., Torregrosa, L. F., Pacheco, R., Bola&ntilde;os-Moreno, Y., &amp; Casanova-Valderrama, M. E. (2025). Factors related to reversal of prediabetes in patients from a cardiovascular risk program during 2019 -&thinsp;2023. Cardiovascular diabetology. \u003cem>Endocrinology reports, 11\u003c/em>(1), 12. https://doi.org/10.1186/s40842-025-00224-w\u003c/li>\n\t\u003cli>Cahyaningsih, I., Rokhman, M. R., Sudikno, Postma, M. J., &amp; van der Schans, J. (2025). Accuracy of the Modified Finnish Diabetes Risk Score (Modified FINDRISC) for detecting metabolic syndrome: Findings from the Indonesian national health survey. \u003cem>PloS one, 20\u003c/em>(2), e0314824. https://doi.org/10.1371/journal.pone.0314824\u003c/li>\n\t\u003cli>Rondanelli, M., Barrile, G. C., Cavioni, A., Donati, P., Genovese, E., Mansueto, F., Mazzola, G., Patelli, Z., Pirola, M., Razza, C., Russano, S., Sivieri, C., Tartara, A., Valentini, E. M., &amp; Perna, S. (2023). A narrative review on strategies for the reversion of prediabetes to Normoglycemia: Food pyramid, physical activity, and self-monitoring innovative glucose devices. \u003cem>Nutrients, 15\u003c/em>(23), 4943. https://doi.org/10.3390/nu15234943\u003c/li>\n\t\u003cli>Rintam&auml;ki, R., Rautio, N., Peltonen, M., Jokelainen, J., Kein&auml;nen-Kiukaanniemi, S., Oksa, H., Saaristo, T., Puolijoki, H., Saltevo, J., Tuomilehto, J., Uusitupa, M., &amp; Moilanen, L. (2021). Long-term outcomes of lifestyle intervention to prevent type 2 diabetes in people at high risk in primary health care. \u003cem>Primary care diabetes, 15\u003c/em>(3), 444&ndash;450. https://doi.org/10.1016/j.pcd.2021.03.002&nbsp;\u003c/li>\n\t\u003cli>Fujiati, I. I., Damanik, H. A., Bachtiar, A., Nurdin, A. A., &amp; Ward, P. (2017). Development and validation of prediabetes risk score for predicting prediabetes among Indonesian adults in primary care: Cross-sectional diagnostic study. \u003cem>Interventional medicine &amp; applied science, 9(\u003c/em>2), 76&ndash;85. https://doi.org/10.1556/1646.9.2017.2.18\u003c/li>\n\t\u003cli>Huang, Y., Cai, X., Mai, W., Li, M., &amp; Hu, Y. (2016). Association between prediabetes and risk of cardiovascular disease and all cause mortality: systematic review and meta-analysis. \u003cem>BMJ (Clinical research ed.), \u003c/em>355, i5953. https://doi.org/10.1136/bmj.i5953\u003c/li>\n\u003c/ul>","min_app_version":null,"type":"math","category_id":2,"slug":"pre-diabetes-screening","formula_male":"[gestational_risk] + [family_risk] + [bp_risk] + [activity_risk] + [bmi_risk]","formula_female":null,"description":"Cek risiko pre-diabetes berdasarkan pola makan, aktivitas, dan indikator kesehatan Anda","is_active":1},"health_faq":[{"id":51,"tool_id":6,"question":"Apa itu pre-diabetes?","answer":"Pre-diabetes adalah kondisi ketika kadar gula darah lebih tinggi dari normal, tetapi belum cukup tinggi untuk didiagnosis sebagai diabetes tipe 2. Tanpa perubahan gaya hidup, banyak kasus pre-diabetes bisa berkembang menjadi diabetes tipe 2 dalam beberapa tahun."},{"id":76,"tool_id":6,"question":"Faktor apa saja yang meningkatkan risiko pre-diabetes?","answer":"Beberapa faktor risiko utama, meliputi usia bertambah, indeks massa tubuh (BMI) tinggi, riwayat keluarga dengan diabetes, tekanan darah tinggi, dan kurang aktivitas fisik. \nSemakin banyak faktor yang dimiliki, semakin tinggi risiko seseorang mengalami gangguan metabolisme gula darah."},{"id":77,"tool_id":6,"question":"Apakah hasil Skrining Pre-Diabetes menunjukkan diagnosis?","answer":"Tidak. Skrining hanya menunjukkan tingkat risiko, bukan diagnosis medis. Jika hasil menunjukkan risiko sedang atau tinggi, Anda perlu melakukan pemeriksaan laboratorium, seperti tes gula darah puasa, tes toleransi glukosa, atau HbA1c untuk memastikan kondisi."},{"id":78,"tool_id":6,"question":"Apa yang harus dilakukan jika hasil menunjukkan risiko tinggi?","answer":"Segera konsultasikan dengan tenaga kesehatan untuk pemeriksaan lanjutan. Anda juga dapat melakukan perubahan gaya hidup, seperti menurunkan berat badan 5–7% dari berat awal, berolahraga minimal 150 menit per minggu, dan mengatur pola makan seimbang (Mayo Clinic, 2024)."},{"id":79,"tool_id":6,"question":"Apakah pre-diabetes bisa dicegah atau diatasi?","answer":"Ya. Perubahan gaya hidup terbukti efektif menurunkan risiko diabetes tipe 2 hingga 58% pada orang dengan risiko tinggi (Rintamaki et al., 2021). Penurunan berat badan, peningkatan aktivitas fisik, dan pola makan sehat berperan besar dalam menstabilkan kadar gula darah."},{"id":80,"tool_id":6,"question":"Apa perbedaan Skrining Pre-Diabetes dengan tes gula darah di laboratorium?","answer":"Skrining Pre-Diabetes terdiri atas pertanyaan untuk memperkirakan risiko berdasarkan faktor usia, indeks massa tubuh (IMT), lingkar pinggang, riwayat keluarga, dan aktivitas fisik.\nTes laboratorium akan mengukur kadar gula darah secara langsung melalui sampel darah dan digunakan untuk menegakkan diagnosis medis secara resmi."},{"id":87,"tool_id":6,"question":"Referensi","answer":"(1) Pre-diabetes. (2025). Harvard Health. Retrieved February 18, 2026, from https://www.health.harvard.edu/diseases-and-conditions/pre-diabetes-a-to-z | (2) Diabetes prevention: 5 tips for taking control. (2024). Mayo Clinic. Retrieved February 18, 2026, from https://www.mayoclinic.org/diseases-conditions/type-2-diabetes/in-depth/diabetes-prevention/art-20047639 | (3) Rintamäki, R., Rautio, N., Peltonen, M., Jokelainen, J., Keinänen-Kiukaanniemi, S., Oksa, H., Saaristo, T., Puolijoki, H., Saltevo, J., Tuomilehto, J., Uusitupa, M., & Moilanen, L. (2021). Long-term outcomes of lifestyle intervention to prevent type 2 diabetes in people at high risk in primary health care. Primary care diabetes, 15(3), 444–450. https://doi.org/10.1016/j.pcd.2021.03.002"}],"health_questions":[{"step":1,"questions":[{"id":40,"tool_id":6,"step":1,"sequence":1,"variable_name":"name","validate":"required|string|min:3|max:255","question_text":"Siapa nama Anda?","question_image":null,"description":null,"input_type":"text","is_gender_specific"
