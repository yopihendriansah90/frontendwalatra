s/b7a5878dd46e5275853ac4a9.ico" rel="icon" type="image/x-icon"/><link data-n-head="ssr" href="/assets/1071dc0e93d26fbbc52fadb5.png" rel="icon" sizes="96x96" type="image/png"/><link data-n-head="ssr" href="/assets/a561b10bfaef5c342318dfe0.png" rel="apple-touch-icon" sizes="180x180"/><link href="/assets/6cf4aff216c7a147185e50ae.css" rel="stylesheet"/>

<body class="w-site"><div id="site-header"></div><main id="site-main"><div class="w-legacy-app"><div data-server-rendered="true" id="__nuxt"></div></div><div class="w-container w-live-slot" data-live-catalog=""></div></main><script>window.__NUXT__={"layout":"default","data":[{"detailHealthTool":{"health_tools":{"id":4,"name":"Skrining Pencernaan","title":"Skrining Pencernaan","image":"/_media/cdn/uploads/imagestorage/banner-pencernaan-4-20-1769594540.png","icon":"/_media/cdn/uploads/imagestorage/icon-pencernaan-16-1769050228.png","color":"#E7F1F4","meta_title":"Skrining Pencernaan │ Deteksi Gangguan Pencernaan","meta_description":"Skrining Pencernaan untuk cek risiko gangguan cerna berdasarkan gejala Anda. Jawab pertanyaan dan dapatkan hasil serta rekomendasi dalam hitungan menit.","footer_content":"\u003ch2>\u003cstrong>Tentang Skrining Pencernaan\u003c/strong>\u003c/h2>\n\n\u003cp>Skrining Pencernaan adalah alat bantu untuk mengetahui risiko \u003ca href=\"/blog/penyakit-pada-sistem-pencernaan\">penyakit pada saluran cerna\u003c/a>, berdasarkan gejala yang Anda alami. Alat skrining ini menggunakan kuesioner berbasis gejala umum masalah pencernaan, termasuk perubahan pola buang air besar, nyeri perut, kembung, mual, dan kebiasaan makan.\u003c/p>\n\n\u003cp>Skrining ini tidak bersifat diagnostik, tetapi hasilnya dapat memberikan gambaran awal tentang kondisi pencernaan Anda. Hal ini juga membantu Anda memutuskan langkah selanjutnya, baik itu cukup dengan perubahan gaya hidup atau perlu segera berkonsultasi dengan tenaga medis.\u003c/p>\n\n\u003ch2>\u003cstrong>Mengapa Kesehatan Pencernaan Penting?\u003c/strong>\u003c/h2>\n\n\u003cp>Sistem pencernaan bukan sekadar jalur masuknya makanan. Saluran cerna merupakan organ kompleks yang berperan dalam penyerapan nutrisi, regulasi sistem imun, bahkan kesehatan mental. Gangguan pada sistem ini dapat berdampak luas pada kualitas hidup sehari-hari.\u003c/p>\n\n\u003cp>Sperber et al. (2021) dalam \u003cem>Rome Foundation Global Study \u003c/em>yang melibatkan 73.076 responden dari 33 negara menemukan bahwa 40,3% populasi dewasa memenuhi kriteria setidaknya satu \u003ca href=\"/diseases/gangguan-pencernaan\">gangguan pencernaan\u003c/a> fungsional, dengan sembelit fungsional dan sindrom iritasi usus besar (IBS) sebagai yang paling sering dilaporkan.\u003c/p>\n\n\u003cp>Di Indonesia, data dari Survei Kesehatan Indonesia 2023 (SKI) yang diterbitkan oleh Kemenkes RI mencatat bahwa gangguan saluran cerna termasuk dalam kategori keluhan kesehatan yang kerap mendorong kunjungan fasilitas pelayanan kesehatan primer.&nbsp;\u003c/p>\n\n\u003ch3>\u003cstrong>Dampak Gangguan Pencernaan terhadap Kualitas Hidup\u003c/strong>\u003c/h3>\n\n\u003cp>Gangguan pencernaan yang tidak ditangani bisa memengaruhi berbagai aspek pada kehidupan sehari-hari, seperti yang dirangkum dalam tabel berikut.\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:142px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Aspek Kehidupan\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:482px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Dampak yang Umum Dilaporkan\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:142px\">\n\t\t\t\u003cp>Produktivitas kerja\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:482px\">\n\t\t\t\u003cp>Ketidakhadiran dan penurunan konsentrasi akibat nyeri atau rasa tidak nyaman pada perut.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:142px\">\n\t\t\t\u003cp>Kualitas tidur\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:482px\">\n\t\t\t\u003cp>Gangguan tidur akibat refluks asam, kembung, atau urgensi buang air besar di malam hari.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:142px\">\n\t\t\t\u003cp>Kesehatan mental\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:482px\">\n\t\t\t\u003cp>Kecemasan dan depresi yang sering berkorelasi dengan sindrom iritasi usus besar (IBS) dan gangguan fungsional lainnya.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:142px\">\n\t\t\t\u003cp>Pola makan\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:482px\">\n\t\t\t\u003cp>Pembatasan makanan secara berlebihan akibat ketakutan memicu gejala gangguan pencernaan.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:142px\">\n\t\t\t\u003cp>Aktivitas sosial\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:482px\">\n\t\t\t\u003cp>Menghindari ikut serta di dalam acara sosial akibat gejala gangguan pencernaan yang bisa muncul tiba-tiba.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003cp>\u003cem>*) Sumber: Sperber et al. (2021).\u003c/em>\u003c/p>\n\n\u003ch2>\u003cstrong>Mengenali Jenis Gangguan Pencernaan\u003c/strong>\u003c/h2>\n\n\u003cp>Gangguan pencernaan dapat dirasakan berupa keluhan ringan yang bersifat sementara hingga kondisi kronis yang memerlukan penanganan medis. Memahami jenis gangguan ini membantu Anda mengenali kapan gejala perlu mendapatkan perhatian lebih serius.\u003c/p>\n\n\u003ch3>\u003cstrong>1. Gangguan Pencernaan Ringan\u003c/strong>\u003c/h3>\n\n\u003cp>Gejala ringan berkaitan langsung dengan faktor gaya hidup. Contohnya meliputi:\u003c/p>\n\n\u003cul>\n\t\u003cli>Kembung sesekali akibat konsumsi makanan tinggi gas.\u003c/li>\n\t\u003cli>Sembelit atau \u003ca href=\"/blog/susah-bab\">susah BAB\u003c/a> akibat kurang minum air atau perubahan pola makan.\u003c/li>\n\t\u003cli>Diare akut akibat infeksi makanan yang berlangsung kurang dari 1&ndash;2 minggu.\u003c/li>\n\t\u003cli>Nyeri ulu hati ringan setelah konsumsi makanan berlemak atau pedas berlebihan.\u003c/li>\n\u003c/ul>\n\n\u003cp>Gejala ringan ini dapat membaik dengan penyesuaian pola makan, peningkatan asupan cairan, dan manajemen stres yang baik.\u003c/p>\n\n\u003ch3>\u003cstrong>2. Gangguan Pencernaan Sedang\u003c/strong>\u003c/h3>\n\n\u003cp>Gejala sedang berlangsung lebih dari dua minggu dan mulai memengaruhi aktivitas sehari-hari. Kategori ini mencakup:\u003c/p>\n\n\u003cul>\n\t\u003cli>Dispepsia fungsional yang ditandai rasa tidak nyaman di ulu hati, cepat kenyang, atau rasa penuh setelah makan yang bersifat berulang tanpa penyebab yang jelas.\u003c/li>\n\t\u003cli>\u003ca href=\"/blog/penyakit-gerd\">GERD atau refluks asam lambung\u003c/a> yang ditandai sensasi terbakar di ulu hati (\u003cem>heartburn\u003c/em>) akibat naiknya asam lambung ke kerongkongan secara berulang.\u003c/li>\n\t\u003cli>Sindrom iritasi usus besar (IBS), nyeri perut berulang yang terkait perubahan pola dan konsistensi buang air besar.\u003c/li>\n\u003c/ul>\n\n\u003ch3>\u003cstrong>3. Gangguan Pencernaan Darurat\u003c/strong>\u003c/h3>\n\n\u003cp>Beberapa gejala mengindikasikan kondisi yang lebih serius dan membutuhkan evaluasi medis segera. Gejala yang perlu diwaspadai, meliputi:\u003c/p>\n\n\u003cul>\n\t\u003cli>Nyeri perut yang hebat dan tiba-tiba.\u003c/li>\n\t\u003cli>Darah pada tinja atau muntah berdarah.\u003c/li>\n\t\u003cli>Penurunan berat badan yang tidak dapat dijelaskan penyebabnya.\u003c/li>\n\t\u003cli>Kesulitan menelan yang memburuk secara bertahap.\u003c/li>\n\t\u003cli>Diare atau sembelit lebih dari 4 minggu tanpa adanya tanda perbaikan.\u003c/li>\n\u003c/ul>\n\n\u003ch2>\u003cstrong>Langkah Menjaga Kesehatan Pencernaan secara Mandiri\u003c/strong>\u003c/h2>\n\n\u003cp>Bukti ilmiah menunjukkan bahwa perubahan gaya hidup merupakan langkah penanganan awal yang efektif untuk sebagian besar gangguan pencernaan ringan hingga sedang. Berikut adalah panduan mandiri yang dapat Anda terapkan.\u003c/p>\n\n\u003ch3>\u003cstrong>1. Penuhi Asupan Serat Harian\u003c/strong>\u003c/h3>\n\n\u003cp>Asupan serat yang cukup mempunyai peranan kunci guna melancarkan pergerakan usus serta memelihara keseimbangan mikrobiota di saluran cerna.\u003c/p>\n\n\u003cp>Berdasarkan Angka Kecukupan Gizi (AKG) Kemenkes RI 2019, kebutuhan serat orang dewasa adalah 25 gram per hari untuk wanita dan 37 gram per hari untuk pria. \u003ca href=\"/blog/makanan-tinggi-serat\">Sumber makanan tinggi serat\u003c/a>, meliputi sayuran, buah-buahan, kacang-kacangan, dan biji-bijian utuh.\u003c/p>\n\n\u003ch3>\u003cstrong>2. Jaga Asupan Cairan yang Cukup\u003c/strong>\u003c/h3>\n\n\u003cp>Air membantu melembutkan tinja dan mendukung pergerakan usus yang normal. Kekurangan cairan merupakan salah satu penyebab sembelit yang paling umum.&nbsp;\u003c/p>\n\n\u003cp>Target biasa yang direkomendasikan adalah setidaknya 2 liter atau sekitar 8 gelas air putih per hari, disesuaikan dengan tingkat aktivitas fisik dan kondisi cuaca.\u003c/p>\n\n\u003ch3>\u003cstrong>3. Lakukan Aktivitas Fisik Teratur\u003c/strong>\u003c/h3>\n\n\u003cp>Olahraga intensitas sedang terbukti bermanfaat untuk kesehatan pencernaan. Sebuah tinjauan sistematis yang menganalisis 231 studi menemukan aktivitas fisik intensitas sedang, mencakup jalan kaki, bersepeda, dan yoga, berkaitan dengan peningkatan \u003ca href=\"/blog/cara-menjaga-kesehatan-usus\">kesehatan usus\u003c/a>, pengurangan peradangan sistemik, dan perbaikan integritas \u003cem>barier \u003c/em>usus pada kondisi, seperti GERD, IBS, IBD, dan sembelit (Al-Beltagi et al., 2025).\u003c/p>\n\n\u003cp>Olahraga juga berperan dalam regulasi sumbu \u003cem>gut-brain\u003c/em>, yaitu jalur komunikasi dua arah antara usus dan otak yang berpengaruh terhadap gejala gangguan pencernaan fungsional.\u003c/p>\n\n\u003ch3>\u003cstrong>4. Kelola Stres dengan Baik\u003c/strong>\u003c/h3>\n\n\u003cp>Stres psikologis punya dampak langsung pada saluran cerna melalui sumbu \u003cem>gut-brain\u003c/em>. Aktivasi sistem saraf simpatik ketika stres memicu peningkatan sitokin pro-inflamasi, termasuk IL-6 dan TNF-&alpha;, yang dapat merusak barier epitel usus dan memperburuk disbiosis mikrobiota (Li et al., 2025).\u003c/p>\n\n\u003cp>Teknik manajemen stres, meliputi meditasi \u003cem>mindfulness\u003c/em>, relaksasi pernapasan dalam, aktivitas fisik teratur, dan tidur yang cukup (7&ndash;9 jam per malam untuk orang dewasa) berperan penting dalam menjaga kesehatan pencernaan.\u003c/p>\n\n\u003ch3>\u003cstrong>5. Pertimbangkan Peran Probiotik\u003c/strong>\u003c/h3>\n\n\u003cp>Tinjauan sistematis dan meta-analisis terhadap 82 uji klinis acak yang melibatkan 10.332 pasien IBS menemukan bahwa beberapa strain probiotik, termasuk \u003cem>Lactobacillus \u003c/em>dan \u003cem>Bifidobacterium\u003c/em>, menunjukkan potensi manfaat dalam mengurangi gejala, meski kualitas bukti masih bervariasi (Goodoory et al., 2023).\u003c/p>\n\n\u003cp>Konsultasikan dengan dokter atau apoteker sebelum memulai \u003ca href=\"/blog/vitamin-probiotik\">suplemen probiotik\u003c/a>, terutama jika Anda sedang menjalani pengobatan atau memiliki kondisi kesehatan tertentu.\u003c/p>\n\n\u003cdiv style=\"background:#eeeeee;border:1px solid #cccccc;padding:5px 10px;\">\n\u003ch2>\u003cstrong>Disclaimer\u003c/strong>\u003c/h2>\n\n\u003cp>Hasil Skrining Pencernaan ini bersifat \u003cstrong>informatif dan tidak menggantikan diagnosis atau saran medis\u003c/strong>. Skrining ini dirancang sebagai alat bantu penilaian awal berdasarkan gejala yang Anda laporkan sendiri. Selalu konsultasikan kondisi kesehatan Anda dengan dokter, terutama bila gejala berlangsung lama, memburuk, atau disertai tanda peringatan.\u003c/p>\n\u003c/div>\n\n\u003cp style=\"text-align:center\">&nbsp;\u003c/p>\n\n\u003cp>\u003cstrong>References:&nbsp;\u003c/strong>\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cem>Digestive health\u003c/em>. (2023). Harvard Health. Retrieved February 18, 2026, from https://www.health.harvard.edu/topics/digestive-health\u003c/li>\n\t\u003cli>\u003cem>Gastrointestinal diseases\u003c/em>. (2017). Cleveland Clinic. Retrieved February 18, 2026, from https://my.clevelandclinic.org/health/articles/7040-gastrointestinal-diseases\u003c/li>\n\t\u003cli>\u003cem>Peraturan Menteri Kesehatan Nomor 28 Tahun 2019 tentang Angka Kecukupan Gizi yang Dianjurkan untuk Masyarakat Indonesia\u003c/em>. (2019). JDIH Kementerian Kesehatan RI. Retrieved February 18, 2026, from https://jdih.kemkes.go.id/documents/peraturan-menteri-kesehatan-nomor-28-tahun-2019\u003c/li>\n\t\u003cli>\u003cem>Survei Kesehatan Indonesia 2023 (SKI)\u003c/em>. (2023). Badan Kebijakan Kesehatan Kemenkes RI. Retrieved February 18, 2026, from https://www.badankebijakan.kemkes.go.id/hasil-ski-2023/\u003c/li>\n\t\u003cli>Al-Beltagi, M., Saeed, N. K., Bediwy, A. S., El-Sawaf, Y., Elbatarny, A., &amp; Elbeltagi, R. (2025). Exploring the gut-exercise link: A systematic review of gastrointestinal disorders in physical activity.\u003cem> World journal of gastroenterology, 31\u003c/em>(22), 106835. https://doi.org/10.3748/wjg.v31.i22.106835\u003c/li>\n\t\u003cli>Li, X., Yuan, Q., Huang, H., &amp; Wang, L. (2025). Gut microbiota in irritable bowel syndrome: a narrative review of mechanisms and microbiome-based therapies. \u003cem>Frontiers in immunology, 16\u003c/em>, 1695321. https://doi.org/10.3389/fimmu.2025.1695321\u003c/li>\n\t\u003cli>Goodoory, V. C., Khasawneh, M., Black, C. J., Quigley, E. M. M., Moayyedi, P., &amp; Ford, A. C. (2023). Efficacy of Probiotics in Irritable Bowel Syndrome: Systematic Review and Meta-analysis. \u003cem>Gastroenterology, 165\u003c/em>(5), 1206&ndash;1218. https://doi.org/10.1053/j.gastro.2023.07.018\u003c/li>\n\t\u003cli>Sperber, A. D., Bangdiwala, S. I., Drossman, D. A., Ghoshal, U. C., Simren, M., Tack, J., Whitehead, W. E., Dumitrascu, D. L., Fang, X., Fukudo, S., Kellow, J., Okeke, E., Quigley, E. M. M., Schmulson, M., Whorwell, P., Archampong, T., Adibi, P., Andresen, V., Benninga, M. A., Bonaz, B., &hellip; Palsson, O. S. (2021). Worldwide Prevalence and Burden of Functional Gastrointestinal Disorders, Results of Rome Foundation Global Study. \u003cem>Gastroenterology, 160\u003c/em>(1), 99&ndash;114.e3. https://doi.org/10.1053/j.gastro.2020.04.014\u003c/li>\n\u003c/ul>","min_app_version":null,"type":"math","category_id":2,"slug":"gut-basic-screening","formula_male":"[bab_freq] + [stool_type] + [bloating] + [fiber_intake] + [sensitivity] + [hydration] + [processed_food]","formula_female":null,"description":"Sering mengalami gangguan pencernaan? Cek kondisi berdasarkan gejala dan kebiasaan harian Anda","is_active":1},"health_faq":[{"id":52,"tool_id":4,"question":"Gejala apa saja yang dinilai dalam Skrining Pencernaan?","answer":"Skrining Pencernaan adalah kuesioner untuk menilai gejala gangguan pencernaan, meliputi nyeri atau kram perut, perut kembung, masalah buang air besar, mual, muntah, dan adanya darah pada tinja. Durasi dan frekuensi gejala juga menjadi pertimbangan dalam menentukan tingkat risiko."},{"id":66,"tool_id":4,"question":"Apakah stres memengaruhi kesehatan pencernaan?","answer":"Ya. Stres dapat memicu atau memperburuk gangguan pencernaan, seperti nyeri perut dan sindrom iritasi usus besar. Mengelola stres dengan tidur cukup dan relaksasi membantu mengurangi gejala."},{"id":67,"tool_id":4,"question":"Bagaimana cara meningkatkan kesehatan sistem pencernaan?","answer":"Anda dapat menjaga kesehatan pencernaan dengan mengonsumsi makanan tinggi serat, cukup minum air, aktivitas fisik teratur, seperti jalan kaki 30 menit setiap hari, serta menghindari makanan tinggi lemak dan pedas secara berlebihan."},{"id":68,"tool_id":4,"question":"Apa peran serat dalam menjaga kesehatan pencernaan?","answer":"Serat membantu melancarkan buang air besar dan menjaga bakteri baik di usus tetap seimbang. Menurut Angka Kecukupan Gizi (AKG) Kemenkes RI 2019, kebutuhan serat orang dewasa berkisar 25–37 gram per hari. Sumber makanan kaya serat, terdiri dari sayur, buah, kacang-kacangan, dan biji-bijian utuh."},{"id":69,"tool_id":4,"question":"Siapa saja yang perlu melakukan Skrining Pencernaan?","answer":"Skrining Pencernaan disarankan bagi Anda yang kerap kali mengalami keluhan, meliputi nyeri perut, kembung, mual, muntah, diare, sembelit, atau perubahan pola buang air besar. Jika keluhan muncul lebih dari 2 minggu atau makin berat, segera konsultasi dengan tenaga medis."},{"id":70,"tool_id":4,"question":"Apakah Skrining Pencernaan menggantikan pemeriksaan dokter?","answer":"Tidak. Skrining Pencernaan menggunakan kuesioner berbasis gejala umum sebagai alat bantu penilaian awal, bukan sebagai pengganti pemeriksaan klinis. \nSkrining hanya memberikan gambaran awal dari jawaban yang Anda isi. Hasil skrining tidak dapat Anda gunakan sebagai diagnosis medis. Pemeriksaan fisik, tes laboratorium, atau prosedur lanjutan tetap diperlukan untuk memastikan kondisi kesehatan Anda."},{"id":85,"tool_id":4,"question":"Referensi","answer":"(1) Digestive health. (2023). Harvard Health. Retrieved February 18, 2026, from https://www.health.harvard.edu/topics/digestive-health | (2) Gastrointestinal diseases. (2017). Cleveland Clinic. Retrieved February 18, 2026, from https://my.clevelandclinic.org/health/articles/7040-gastrointestinal-diseases | (3) Peraturan Menteri Kesehatan Nomor 28 Tahun 2019 tentang Angka Kecukupan Gizi yang Dianjurkan untuk Masyarakat Indonesia. (2019). Database Peraturan BPK . Retrieved February 18, 2026, from https://peraturan.bpk.go.id/Details/138621/permenkes-no-28-tahun-2019"}],"health_questions":[{"step":1,"questions":[{"id":19,"tool_id":4,"step":1,"sequence":1,"variable_name":"name","validate":"required|string|min:3|max:255","question_text":"Siapa nama Anda?","question_image":null,"description":null,"input_type":"text","is_gender_specific":"0","suffix":null,"default":null,"health_questions_options":[]},{"id":20,"tool_id":4,"step":1,"sequence":2,"variable_name":"gender","validate":"required|integer|in:1,2","question_text":"Apa jenis kelamin Anda?","question_image":null,"description":"*Diperlukan untuk hasil yang lebih akurat","input_type":"radioimage","is_gender_specific":"0","suffix":null,"default":null,"health_questions_options":[{"id":24,"question_id":20,"option_label":"Laki-laki","image":"/_media/cdn/uploads/imagestorage/male-icon-37-1769143069.png","score_value":"1"},{"id":25,"question_id":20,"option_label"
