<body class="w-site"><div id="site-header"></div><main id="site-main"><div class="w-legacy-app"><div data-server-rendered="true" id="__nuxt"></div></div><div class="w-container w-live-slot" data-live-catalog=""></div></main><script>window.__NUXT__={"layout":"default","data":[{"detailHealthTool":{"health_tools":{"id":8,"name":"Deteksi Risiko Osteoporosis","title":"Deteksi Risiko Osteoporosis","image":"/_media/cdn/uploads/imagestorage/banner-osteoporosis-48-1784110838.png","icon":"/_media/cdn/uploads/imagestorage/icon-osteoporosis-95-1784104494.png","color":"#FFF0DF","meta_title":"Deteksi Risiko Osteoporosis Online │ Cek Osteoporosis Gratis","meta_description":"Lakukan Deteksi Risiko Osteoporosis secara online dan gratis. Kenali faktor risiko dan ambil langkah tepat untuk menjaga kesehatan tulang. Cek sekarang!","footer_content":"\u003ch2>\u003cstrong>Tentang Deteksi Risiko Osteoporosis\u003c/strong>\u003c/h2>\n\n\u003cp>Deteksi risiko osteoporosis adalah alat skrining mandiri yang membantu mengenali faktor-faktor risiko \u003ca href=\"/blog/apa-itu-osteoporosis\">osteoporosis\u003c/a>. Skrining ini bukan diagnosis medis, tetapi bisa menjadi langkah awal untuk mengetahui apakah Anda perlu berkonsultasi lebih lanjut dengan tenaga kesehatan.\u003c/p>\n\n\u003cp>Skrining ini menilai berbagai faktor terkait risiko osteoporosis, seperti usia, jenis kelamin, status menopause, indeks massa tubuh (IMT), riwayat patah tulang, riwayat keluarga, konsumsi obat tertentu, kebiasaan merokok, konsumsi alkohol, serta tingkat aktivitas fisik.&nbsp;\u003c/p>\n\n\u003cp>Hasil skrining diharapkan dapat membantu Anda mengambil langkah yang tepat untuk menjaga kesehatan tulang sejak dini.\u003c/p>\n\n\u003ch2>\u003cstrong>Mengapa Osteoporosis Perlu Diwaspadai?\u003c/strong>\u003c/h2>\n\n\u003cp>Osteoporosis adalah kondisi ketika kepadatan dan kualitas tulang menurun sehingga tulang jadi keropos, rapuh, dan mudah patah. Penyakit ini sering kali disebut sebagai \u003cem>silent disease\u003c/em> karena gejalanya mungkin tidak timbul hingga terjadi patah tulang.\u003c/p>\n\n\u003cp>Menurut Kemenkes RI, osteoporosis umumnya terjadi pada usia lanjut, terutama wanita. Angka kejadian osteoporosis di Indonesia mencapai 23% pada wanita berusia 50&ndash;80 tahun dan 53% pada wanita berusia di atas 80 tahun. Angka ini menunjukkan bahwa osteoporosis bukan kondisi yang bisa diabaikan, terutama seiring bertambahnya usia.\u003c/p>\n\n\u003ch2>\u003cstrong>Faktor yang Meningkatkan Risiko Osteoporosis\u003c/strong>\u003c/h2>\n\n\u003cp>Risiko osteoporosis dipengaruhi oleh kombinasi faktor yang tidak dapat diubah dan faktor yang dapat dikendalikan melalui gaya hidup. Memahami kedua kelompok ini penting agar langkah pencegahan dapat dilakukan secara tepat sasaran.\u003c/p>\n\n\u003cp>Beberapa \u003ca href=\"/blog/apa-penyebab-osteoporosis\">faktor risiko osteoporosis\u003c/a> yang dapat diubah adalah sebagai berikut.\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cstrong>Usia. \u003c/strong>Kepadatan tulang mulai menurun setelah usia 30 tahun dan makin cepat setelah usia 50 tahun.\u003c/li>\n\t\u003cli>\u003cstrong>Jenis kelamin. \u003c/strong>Wanita punya massa tulang yang lebih kecil dan mengalami penurunan hormon estrogen saat menopause, yang mempercepat \u003ca href=\"/blog/ciri-ciri-tulang-keropos\">pengeroposan tulang\u003c/a>.\u003c/li>\n\t\u003cli>\u003cstrong>Riwayat keluarga. \u003c/strong>Memiliki orang tua atau saudara kandung dengan osteoporosis bisa meningkatkan risiko secara signifikan.\u003c/li>\n\t\u003cli>\u003cstrong>Riwayat patah tulang.\u003c/strong> Pernah mengalami patah tulang akibat benturan ringan menjadi indikator kuat bahwa kepadatan tulang sudah berkurang.\u003c/li>\n\u003c/ul>\n\n\u003cp>Sementara itu, beberapa faktor lain yang dapat dikendalikan seperti berikut ini.\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cstrong>Kurang nutrisi. \u003c/strong>Kekurangan asupan kalsium dan vitamin D dalam jangka panjang akan berdampak langsung pada kepadatan tulang.\u003c/li>\n\t\u003cli>\u003cstrong>Kurang aktivitas fisik. \u003c/strong>Gaya hidup kurang gerak (sedenter) dapat mempercepat proses penurunan massa tulang.\u003c/li>\n\t\u003cli>\u003cstrong>Merokok. \u003c/strong>Nikotin dalam rokok bisa menghambat penyerapan kalsium dan mengganggu keseimbangan hormon yang berperan dalam pembentukan tulang.\u003c/li>\n\t\u003cli>\u003cstrong>Konsumsi alkohol berlebih. \u003c/strong>Alkohol akan menekan aktivitas sel pembentuk tulang dan mengganggu metabolisme kalsium dan \u003ca href=\"/blog/manfaat-vitamin-d\">vitamin D\u003c/a>.\u003c/li>\n\t\u003cli>\u003cstrong>Konsumsi kafein berlebih. \u003c/strong>Kafein dalam jumlah tinggi bisa meningkatkan pengeluaran kalsium melalui urine, terutama bila asupan kalsium harian sudah rendah.\u003c/li>\n\t\u003cli>\u003cstrong>Penggunaan kortikosteroid jangka panjang. \u003c/strong>Jenis obat ini dapat mengganggu proses pembentukan tulang dan mempercepat resorpsi tulang bila dipakai dalam waktu lama.\u003c/li>\n\t\u003cli>\u003cstrong>Penyakit tertentu. \u003c/strong>Gangguan tiroid, penyakit celiac, penyakit radang usus, dan masalah hormonal bisa memengaruhi kepadatan tulang.\u003c/li>\n\u003c/ul>\n\n\u003cp>Memiliki satu atau beberapa faktor risiko tidak berarti Anda pasti akan mengalami osteoporosis. Akan tetapi, semakin banyak faktor risiko yang dimiliki, semakin penting untuk mulai menjaga kesehatan tulang dan melakukan evaluasi lebih lanjut bersama dokter.\u003c/p>\n\n\u003ch2>\u003cstrong>Osteopenia vs Osteoporosis: Apa Bedanya?\u003c/strong>\u003c/h2>\n\n\u003cp>Osteopenia dan osteoporosis merupakan dua keadaan berbeda yang menggambarkan tingkat penurunan kepadatan tulang. Keduanya diukur menggunakan pemeriksaan kepadatan tulang (DXA scan) dan dinyatakan dalam nilai T-score.\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:143px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Kondisi\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:149px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>T-score\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:332px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Penjelasan\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:143px\">\n\t\t\t\u003cp>Normal\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:149px\">\n\t\t\t\u003cp style=\"text-align:center\">-1.0 ke atas\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:332px\">\n\t\t\t\u003cp>Kepadatan tulang dalam rentang sehat untuk usia dewasa muda.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:143px\">\n\t\t\t\u003cp>Osteopenia\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:149px\">\n\t\t\t\u003cp style=\"text-align:center\">-1.0 s.d. -2.5\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:332px\">\n\t\t\t\u003cp>Kepadatan tulang di bawah normal, tetapi belum dikategorikan sebagai osteoporosis. Tahap awal yang perlu diwaspadai.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:143px\">\n\t\t\t\u003cp>Osteoporosis\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:149px\">\n\t\t\t\u003cp style=\"text-align:center\">-2.5 ke bawah\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:332px\">\n\t\t\t\u003cp>Kepadatan tulang sangat rendah, tulang rentan patah bahkan akibat benturan ringan atau tanpa trauma berarti.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:143px\">\n\t\t\t\u003cp>Osteoporosis Berat\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:149px\">\n\t\t\t\u003cp style=\"text-align:center\">-2.5 ke bawah + riwayat patah tulang\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:332px\">\n\t\t\t\u003cp>Osteoporosis yang sudah disertai setidaknya satu kejadian patah tulang.\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003cp>Osteopenia adalah kondisi yang masih bisa dibalik atau diperlambat perkembangannya dengan perubahan gaya hidup dan intervensi medis bila diperlukan. Oleh karena itu, deteksi dini sangat penting agar \u003ca href=\"/diseases/tulang\">masalah tulang\u003c/a> tidak berkembang menjadi kondisi yang lebih serius.\u003c/p>\n\n\u003ch2>\u003cstrong>Cara Menjaga Kesehatan Tulang\u003c/strong>\u003c/h2>\n\n\u003cp>Menjaga kesehatan tulang adalah investasi jangka panjang yang paling efektif bila dimulai sejak dini. Berikut ini adalah langkah-langkah yang dapat Anda lakukan secara mandiri.\u003c/p>\n\n\u003ch3>\u003cstrong>1. Penuhi Kebutuhan Kalsium\u003c/strong>\u003c/h3>\n\n\u003cp>Kalsium adalah mineral utama penyusun tulang. Kebutuhan kalsium harian orang dewasa, yaitu 1.000&ndash;1.200 mg per hari dan meningkat seiring usia. Susu, ikan teri, tahu, tempe, serta sayuran hijau merupakan sumber kalsium terbaik. Bila asupan dari makanan tidak mencukupi, \u003ca href=\"/blog/vitamin-tulang-dan-sendi\">suplemen tulang\u003c/a> yang mengandung kalsium dapat dipertimbangkan setelah berkonsultasi dengan dokter.\u003c/p>\n\n\u003ch3>\u003cstrong>2. Dapatkan Vitamin D yang Cukup\u003c/strong>\u003c/h3>\n\n\u003cp>Vitamin D membantu usus menyerap kalsium. Tanpa vitamin D cukup, kalsium dari makanan ini tidak dapat diserap optimal meski asupannya tinggi. Sumber utama vitamin D adalah paparan sinar matahari pagi sekitar 10&ndash;30 menit per hari, serta makanan, seperti ikan berlemak, telur, dan produk yang difortifikasi.\u003c/p>\n\n\u003ch3>\u003cstrong>3. Rutin Olahraga\u003c/strong>\u003c/h3>\n\n\u003cp>Jalan kaki, \u003cem>jogging\u003c/em>, naik-turun tangga, angkat beban ringan, hingga senam mampu merangsang pembentukan tulang baru dan memperlambat pengeroposan. Latihan kekuatan juga tidak kalah penting karena otot yang kuat membantu menstabilkan postur tubuh serta mengurangi risiko jatuh yang dapat berujung pada patah tulang.\u003c/p>\n\n\u003ch3>\u003cstrong>4. Hindari Rokok dan Alkohol\u003c/strong>\u003c/h3>\n\n\u003cp>Merokok terbukti menghambat penyerapan kalsium serta mengganggu keseimbangan hormon yang diperlukan untuk pembentukan tulang. Konsumsi alkohol berlebihan juga dapat menekan aktivitas sel pembentuk tulang dan memperburuk metabolisme kalsium di dalam tubuh.\u003c/p>\n\n\u003ch3>\u003cstrong>5. Jaga Berat Badan Ideal\u003c/strong>\u003c/h3>\n\n\u003cp>Berat badan terlalu rendah dan tinggi terkait dengan peningkatan risiko osteoporosis. Menjaga indeks massa tubuh (IMT) dalam rentang sehat (18,5&ndash;24,9) dan mempertahankan gaya hidup aktif, termasuk menghindari duduk dalam waktu sangat lama, membantu \u003ca href=\"/blog/cara-menjaga-tulang-tetap-sehat\">menjaga kesehatan tulang\u003c/a> secara keseluruhan.\u003c/p>\n\n\u003ch2>\u003cstrong>Kapan Harus Berkonsultasi dengan Dokter?\u003c/strong>\u003c/h2>\n\n\u003cp>Segera konsultasikan kondisi Anda dengan dokter apabila mengalami beberapa kondisi berikut.\u003c/p>\n\n\u003cul>\n\t\u003cli>Pernah mengalami patah tulang akibat benturan ringan atau tanpa sebab yang jelas.\u003c/li>\n\t\u003cli>Mengalami penurunan tinggi badan secara bertahap atau postur yang semakin bungkuk.\u003c/li>\n\t\u003cli>Mengalami nyeri punggung terus-menerus yang tidak diketahui penyebabnya.\u003c/li>\n\t\u003cli>Memiliki beberapa faktor risiko osteoporosis sekaligus, terutama pasca-menopause atau berusia di atas 65 tahun.\u003c/li>\n\t\u003cli>Menggunakan kortikosteroid jangka panjang atas mengidap kondisi medis tertentu.\u003c/li>\n\u003c/ul>\n\n\u003cp>Dokter dapat menentukan apakah pemeriksaan kepadatan tulang (DXA scan) dibutuhkan serta merancang rencana penanganan yang sesuai dengan kondisi Anda.\u003c/p>\n\n\u003cdiv style=\"background:#eeeeee; border:1px solid #cccccc; padding:5px 10px\">\n\u003ch2>\u003cstrong>Disclaimer\u003c/strong>\u003c/h2>\n\n\u003cp>Hasil Deteksi Risiko Osteoporosis ini bersifat \u003cstrong>informatif dan tidak menggantikan diagnosis medis\u003c/strong>. Jika hasil menunjukkan risiko sedang atau tinggi, atau Anda memiliki keluhan terkait kesehatan tulang, konsultasikan dengan tenaga kesehatan untuk pemeriksaan lebih lanjut.\u003c/p>\n\u003c/div>\n\n\u003cp style=\"text-align:center\">&nbsp;\u003c/p>\n\n\u003cp>\u003cstrong>References:&nbsp;\u003c/strong>\u003c/p>\n\n\u003cul>\n\t\u003cli>Anasulfalah, H., Verasita, P., Widiyanto, A., &amp; Atmojo, J. T. (2023). Smoking Behavior and the Incident of Osteoporosis in the Elderly: Meta-Analysis. \u003cem>Indonesian Journal of Global Health Research\u003c/em>, \u003cem>5\u003c/em>(4), 735&ndash;742. https://doi.org/10.37287/ijghr.v5i4.2426\u003c/li>\n\t\u003cli>Bouvard, B., Annweiler, C., &amp; Legrand, E. (2021). Osteoporosis in older adults. In \u003cem>Joint Bone Spine\u003c/em> (Vol. 88, Number 3). Elsevier Masson s.r.l. https://doi.org/10.1016/j.jbspin.2021.105135\u003c/li>\n\t\u003cli>International Osteoporosis Foundation. (n.d.). \u003cem>About osteoporosis\u003c/em>. Retrieved July 7, 2026, from https://www.osteoporosis.foundation/patients/about-osteoporosis\u003c/li>\n\t\u003cli>Li, W., Xie, Y., &amp; Jiang, L. (2025). Coffee and tea consumption on the risk of osteoporosis: a meta-analysis. In \u003cem>Frontiers in Nutrition\u003c/em> (Vol. 12). Frontiers Media SA. https://doi.org/10.3389/fnut.2025.1559835\u003c/li>\n\t\u003cli>Mayo Clinic. (2025). \u003cem>Osteoporosis: Symptoms &amp; causes\u003c/em>. Retrieved July 7, 2026, from https://www.mayoclinic.org/diseases-conditions/osteoporosis/symptoms-causes/syc-20351968\u003c/li>\n\t\u003cli>Monadnock Community Hospital. (2024). \u003cem>Osteoporosis: Understanding risk factors and prevention strategies\u003c/em>. Retrieved July 7, 2026, from dj.2021036\u003c/li>\n\t\u003cli>UC San Diego Health. (n.d.). \u003cem>Osteoporosis prevention\u003c/em>. Retrieved July 7, 2026, from https://health.ucsd.edu/care/endocrinology-diabetes/osteoporosis/prevention/\u003c/li>\n\u003c/ul>","min_app_version":"1.3.36","type":"math","category_id":2,"slug":"osteoporosis-risk-detection","formula_male":"[age_risk] + [bmi_risk] + [fracture_history] + [family_history] + [medical_conditions] + [medications] + [alcohol_smoking] + [calcium_vitd] + [fall_history] + [exercise]","formula_female":"[age_risk] + [bmi_risk] + [fracture_history] + [menopause_status] + [family_history] + [medical_conditions] + [medications] + [alcohol_smoking] + [calcium_vitd] + [fall_history] + [exercise]","description":"Sudah tahu kondisi tulang Anda? Cek risiko osteoporosis sebelum gejala muncul","is_active":1},"health_faq":[{"id":94,"tool_id":8,"question":"Apa penyebab osteoporosis?","answer":"Osteoporosis terjadi ketika proses penghancuran tulang berlangsung lebih cepat daripada pembentukan tulang baru. Akibatnya, kepadatan dan kekuatan tulang menurun sehingga tulang menjadi rapuh dan lebih mudah patah."},{"id":95,"tool_id":8,"question":"Apa saja faktor risiko osteoporosis?","answer":"Faktor risiko osteoporosis, antara lain usia lanjut, pasca-menopause, riwayat keluarga, berat badan rendah, kurang aktivitas fisik, asupan kalsium dan vitamin D rendah, merokok, konsumsi alkohol berlebih, serta penggunaan kortikosteroid jangka panjang."},{"id":96,"tool_id":8,"question":"Seperti apa gejala osteoporosis?","answer":"Ciri-ciri osteoporosis, antara lain nyeri punggung akibat patah tulang belakang, tinggi badan berkurang, postur membungkuk, atau tulang mudah patah karena benturan ringan. Meski begitu, osteoporosis mungkin tidak menimbulkan gejala pada tahap awal."},{"id":97,"tool_id":8,"question":"Bagaimana cara mencegah osteoporosis?","answer":"Pencegahan osteoporosis dilakukan dengan memenuhi kebutuhan kalsium dan vitamin D, rutin olahraga terutama latihan beban, tidak merokok, menghindari konsumsi alkohol berlebihan, dan menjaga berat badan ideal."},{"id":98,"tool_id":8,"question":"Vitamin apa yang bagus untuk osteoporosis?","answer":"Vitamin D berperan membantu penyerapan kalsium, sehingga penting untuk menjaga kesehatan tulang. Selain vitamin D, kalsium yang juga diperlukan untuk mempertahankan kepadatan tulang. Keduanya bisa dipenuhi melalui makanan atau suplemen sesuai dengan anjuran tenaga kesehatan."},{"id":99,"tool_id":8,"question":"Bagaimana cara mendeteksi osteoporosis?","answer":"Osteoporosis dapat dideteksi melalui pemeriksaan kepadatan tulang menggunakan Dual-energy X-ray Absorptiometry (DXA/DXA scan) di fasilitas kesehatan. Sebelum pemeriksaan tersebut, Anda juga dapat melakukan Deteksi Risiko Osteoporosis dari Natural Farm sebagai langkah mandiri sebelum berkonsultasi dengan dokter."},{"id":126,"tool_id":8,"question":"Referensi","answer":"Anasulfalah, H., Verasita, P., Widiyanto, A., & Atmojo, J. T. (2023). Smoking Behavior and the Incident of Osteoporosis in the Elderly: Meta-Analysis. Indonesian Journal of Global Health Research, 5(4), 735–742. https://doi.org/10.37287/ijghr.v5i4.2426\nBouvard, B., Annweiler, C., & Legrand, E. (2021). Osteoporosis in older adults. In Joint Bone Spine (Vol. 88, Number 3). Elsevier Masson s.r.l. https://doi.org/10.1016/j.jbspin.2021.105135\nInternational Osteoporosis Foundation. (n.d.). About osteoporosis. Retrieved July 7, 2026, from https://www.osteoporosis.foundation/patients/about-osteoporosis"}],"health_questions":[{"step":1,"questions":[{"id":60,"tool_id":8,"step":1,"sequence":1,"variable_name":"name","validate":"required|string|min:3|max:255","question_text":"Siapa nama Anda?","question_image":null,"description":null,"input_type":"text","is_gender_specific":"0","suffix":null,"default":null,"health_questions_options":[]},{"id":61,"tool_id":8,"step":1,"sequence":2,"variable_name":"gender","validate":"required|integer|in:1,2","question_text":"Apa jenis kelamin Anda?",
