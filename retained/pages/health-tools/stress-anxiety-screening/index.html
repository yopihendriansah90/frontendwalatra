<body class="w-site"><div id="site-header"></div><main id="site-main"><div class="w-legacy-app"><div data-server-rendered="true" id="__nuxt"></div></div><div class="w-container w-live-slot" data-live-catalog=""></div></main><script>window.__NUXT__={"layout":"default","data":[{"detailHealthTool":{"health_tools":{"id":5,"name":"Skrining Stres dan Kecemasan","title":"Skrining Stres dan Kecemasan","image":"/_media/cdn/uploads/imagestorage/banner-stress-anxiety-2-44-1769594155.png","icon":"/_media/cdn/uploads/imagestorage/icon-stress-15-1769050242.png","color":"#F7E9E9","meta_title":"Skrining Stres dan Kecemasan Online Gratis","meta_description":"Cek tingkat stres dan kecemasan Anda dengan skrining online gratis. Dapatkan hasil dalam hitungan menit dan temukan langkah untuk menjaga kesehatan mental.","footer_content":"\u003ch2>\u003cstrong>Tentang Skrining Stres dan Kecemasan\u003c/strong>\u003c/h2>\n\n\u003cp>Skrining Stres dan Kecemasan adalah alat evaluasi mandiri untuk membantu Anda mengenali sejauh mana \u003ca href=\"/blog/gejala-stress-berat\">gejala stres\u003c/a> dan kecemasan memengaruhi kehidupan sehari-hari.&nbsp;\u003c/p>\n\n\u003cp>Dalam skrining ini, Anda akan diminta untuk menjawab beberapa pertanyaan seputar keadaan emosional, pola pikir, kualitas tidur, dan respons fisik yang dialami dalam dua minggu terakhir. Setiap jawaban memiliki skor yang akan dijumlahkan untuk menentukan kategori tingkat stres dan kecemasan yang Anda alami.\u003c/p>\n\n\u003cp>Perlu diketahui bahwa hasil skrining ini bersifat informatif dan \u003cstrong>tidak menggantikan diagnosis medis atau psikologis\u003c/strong>. Hasil yang Anda dapatkan merupakan gambaran awal yang menjadi langkah pertama menuju \u003ca href=\"/diseases/kesehatan-mental\">kesehatan mental\u003c/a> yang lebih baik.\u003c/p>\n\n\u003ch2>\u003cstrong>Mengapa Stres dan Kecemasan Penting untuk Diperhatikan?\u003c/strong>\u003c/h2>\n\n\u003cp>Stres dan kecemasan bukan sekadar perasaan tidak nyaman. Keduanya punya dampak nyata terhadap kesehatan fisik, produktivitas, dan kualitas hidup secara keseluruhan.&nbsp;\u003c/p>\n\n\u003cp>Di tingkat global, gangguan kecemasan (\u003ca href=\"/blog/anxiety-adalah\">\u003cem>anxiety disorder\u003c/em>\u003c/a>) merupakan gangguan mental paling umum, dengan lebih dari 301 juta kasus tercatat di tahun 2019 (Yang et al., 2021). Angka ini meningkat 50% dari tahun 1990 hingga 2019, dengan perempuan menunjukkan prevalensi yang lebih tinggi dibandingkan laki-laki.\u003c/p>\n\n\u003cp>Di Indonesia, Riset Kesehatan Dasar (Riskesdas) 2018 mencatat prevalensi \u003ca href=\"/blog/macam-macam-gangguan-mental\">gangguan mental\u003c/a> dan emosional pada penduduk berusia 15 tahun ke atas mencapai 9,8%, meningkat signifikan dari 6% pada tahun 2013 (Kemenkes RI, 2019). Itu artinya, lebih dari 19 juta orang dewasa di Indonesia berpotensi mengalami gejala stres atau kecemasan yang memerlukan perhatian.\u003c/p>\n\n\u003ch3>\u003cstrong>Dampak Stres dan Kecemasan yang Tidak Ditangani\u003c/strong>\u003c/h3>\n\n\u003cp>Bila dibiarkan tanpa penanganan, stres dan kecemasan membawa dampak luas seperti berikut.\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:224px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Area Dampak\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:400px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Manifestasi Umum\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:224px\">\n\t\t\t\u003cp>Kesehatan fisik\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:400px\">\n\t\t\t\u003cp>Sakit kepala, gangguan pencernaan, nyeri otot, penurunan imunitas\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:224px\">\n\t\t\t\u003cp>Kualitas tidur\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:400px\">\n\t\t\t\u003cp>Insomnia, tidur tidak nyenyak, sering terbangun di tengah malam\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:224px\">\n\t\t\t\u003cp>Fungsi kognitif\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:400px\">\n\t\t\t\u003cp>Sulit berkonsentrasi, mudah lupa, penurunan produktivitas di tempat kerja\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:224px\">\n\t\t\t\u003cp>Hubungan sosial\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:400px\">\n\t\t\t\u003cp>Mudah tersinggung, menarik diri dari lingkungan (isolasi), konflik dengan orang lain\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:224px\">\n\t\t\t\u003cp>Kesehatan jangka panjang\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:400px\">\n\t\t\t\u003cp>Risiko lebih tinggi terkena tekanan darah tinggi (hipertensi), penyakit jantung, dan depresi\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003ch2>\u003cstrong>Mengenali Tingkat Stres dan Kecemasan\u003c/strong>\u003c/h2>\n\n\u003cp>Gejala stres dan kecemasan tidak selalu mudah dikenali, terutama karena gejalanya kerap kali tumpang tindih dengan kelelahan sehari-hari.&nbsp;\u003c/p>\n\n\u003cp>Berikut ini adalah gambaran umum dari tiap tingkatan berdasarkan Perceived Stress Scale-10 (PSS-10) dan Generalized Anxiety Disorder-7 (GAD-7).\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:112px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Kondisi\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:188px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Pemicu\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:122px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Durasi\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:202px\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>Karakteristik\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:112px\">\n\t\t\t\u003cp>Stres\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:188px\">\n\t\t\t\u003cp>Tekanan eksternal yang nyata, seperti pekerjaan dan keuangan\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:122px\">\n\t\t\t\u003cp>Biasanya sementara\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:202px\">\n\t\t\t\u003cp>Mereda ketika pemicu hilang\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:112px\">\n\t\t\t\u003cp>Kecemasan\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:188px\">\n\t\t\t\u003cp>Khawatir berlebihan dan sering tanpa pemicu yang jelas\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:122px\">\n\t\t\t\u003cp>Persisten (&ge;2 minggu)\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:202px\">\n\t\t\t\u003cp>Tetap ada meski situasi aman\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:112px\">\n\t\t\t\u003cp>Depresi\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:188px\">\n\t\t\t\u003cp>Multifaktorial\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:122px\">\n\t\t\t\u003cp>Berkepanjangan\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top; width:202px\">\n\t\t\t\u003cp>Kehilangan minat, energi rendah, rasa tidak berdaya\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003ch3>\u003cstrong>Kapan Harus Berkonsultasi dengan Profesional?\u003c/strong>\u003c/h3>\n\n\u003cp>Segera cari bantuan psikolog atau psikiater apabila Anda mengalami kondisi berikut ini.\u003c/p>\n\n\u003cul>\n\t\u003cli>Gejala cemas atau stres yang berlangsung lebih dari dua minggu dan tidak membaik.\u003c/li>\n\t\u003cli>Gejala yang mengganggu aktivitas kerja, hubungan sosial, atau rutinitas harian.\u003c/li>\n\t\u003cli>Pikiran yang berulang tentang ketakutan tanpa dasar yang jelas.\u003c/li>\n\t\u003cli>Gangguan tidur berat yang tidak membaik dengan perubahan gaya hidup.\u003c/li>\n\t\u003cli>Perasaan putus asa, tidak berdaya, atau kehilangan minat terhadap hal-hal yang biasanya dinikmati.\u003c/li>\n\t\u003cli>Gejala fisik yang tidak dapat dijelaskan secara medis, meliputi nyeri dada atau sesak napas berulang.\u003c/li>\n\u003c/ul>\n\n\u003cp>Mencari bantuan profesional menjadi langkah yang tepat dan proaktif, bukan tanda kelemahan.\u003c/p>\n\n\u003ch2>\u003cstrong>Langkah Mengelola Stres dan Kecemasan secara Mandiri\u003c/strong>\u003c/h2>\n\n\u003cp>Untuk tingkat stres minimal hingga ringan, perubahan gaya hidup dapat memberikan perbedaan yang signifikan. Berikut ini beberapa \u003ca href=\"/blog/kesehatan-mental\">cara menjaga mental sehat\u003c/a> yang direkomendasikan.\u003c/p>\n\n\u003ch3>\u003cstrong>1. Aktivitas Fisik Teratur\u003c/strong>\u003c/h3>\n\n\u003cp>Olahraga aerobik telah terbukti secara konsisten bisa menurunkan gejala kecemasan dan stres. Meta-analisis dari berbagai uji klinis acak menunjukkan bahwa latihan aerobik, seperti berjalan, bersepeda, dan berlari dapat menurunkan gejala kecemasan secara signifikan, terutama ketika dilakukan minimal tiga kali seminggu (Aylett et al., 2018).&nbsp;\u003c/p>\n\n\u003cp>World Health Organization (WHO) sendiri telah merekomendasikan 150&ndash;300 menit aktivitas fisik intensitas sedang per minggu untuk mendukung kesehatan mental optimal.\u003c/p>\n\n\u003ch3>\u003cstrong>2. Teknik Relaksasi dan Mindfulness\u003c/strong>\u003c/h3>\n\n\u003cp>Program Mindfulness-Based Stress Reduction (MBSR) dan Mindfulness-Based Cognitive Therapy (MBCT) telah menunjukkan efektivitas dalam \u003ca href=\"/blog/cara-menghilangkan-stres\">menurunkan kadar stres\u003c/a> yang dirasakan, mencegah kekambuhan depresi, dan meningkatkan regulasi emosi (Li et al., 2021).&nbsp;\u003c/p>\n\n\u003cp>Praktik sederhana, seperti pernapasan diafragma atau meditasi \u003cem>mindfulness \u003c/em>10 menit tiap hari, dapat dilakukan secara mandiri sebagai langkah awal.\u003c/p>\n\n\u003ch3>\u003cstrong>3. Pengaturan Beban Aktivitas\u003c/strong>\u003c/h3>\n\n\u003cp>Manajemen waktu yang baik, antara lain membuat daftar prioritas harian, menetapkan batasan yang sehat, dan meluangkan waktu istirahat di antara tugas, dapat mengurangi beban kognitif yang tanpa disadari menjadi sumber stres.\u003c/p>\n\n\u003ch3>\u003cstrong>4. Manajemen Tidur\u003c/strong>\u003c/h3>\n\n\u003cp>Kualitas tidur dan kesehatan mental memiliki hubungan dua arah: stres mengganggu tidur dan kurang tidur atau \u003ca href=\"/diseases/insomnia\">insomnia\u003c/a> dapat memperburuk stres. Disarankan menjaga waktu tidur-bangun konsisten, menghindari kafein setelah pukul 14.00, dan membatasi paparan layar 30 menit sebelum tidur.\u003c/p>\n\n\u003ch3>\u003cstrong>5. Dukungan Sosial\u003c/strong>\u003c/h3>\n\n\u003cp>Koneksi sosial yang kuat menjadi faktor protektif penting terhadap gangguan mental. Berbagi perasaan dengan orang yang Anda percaya, bergabung dengan komunitas yang mendukung (\u003cem>support group\u003c/em>), atau mengikuti sesi konseling akan membantu memproses beban emosional dengan lebih sehat.\u003c/p>\n\n\u003cdiv style=\"background:#eeeeee;border:1px solid #cccccc;padding:5px 10px;\">\n\u003ch2>\u003cstrong>Disclaimer\u003c/strong>\u003c/h2>\n\n\u003cp>Hasil Skrining Stres dan Kecemasan ini bersifat \u003cstrong>informatif dan edukasi semata\u003c/strong>. Hasil yang ditampilkan tidak bisa digunakan sebagai dasar diagnosis, tidak menggantikan evaluasi klinis oleh profesional, dan tidak merupakan rekomendasi pengobatan dalam bentuk apa pun.\u003c/p>\n\n\u003cp>Apabila Anda atau orang di sekitar Anda menunjukkan gejala yang mengkhawatirkan, segera \u003cstrong>konsultasi dengan psikolog atau psikiater\u003c/strong>.\u003c/p>\n\n\u003cp>Suplemen yang disebutkan di dalam rekomendasi produk di halaman ini bukan obat dan tidak dimaksudkan untuk mendiagnosis, mengobati, menyembuhkan, atau mencegah penyakit apa pun. Konsultasikan penggunaan suplemen dengan tenaga kesehatan Anda.\u003c/p>\n\u003c/div>\n\n\u003cp style=\"text-align:center\">&nbsp;\u003c/p>\n\n\u003cp>\u003cstrong>References:&nbsp;\u003c/strong>\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cem>Stress.\u003c/em> (2026). American Psychological Association. Retrieved February 18, 2026, from https://www.apa.org/topics/stress\u003c/li>\n\t\u003cli>\u003cem>Managing stress. \u003c/em>(2026). U.S. Centers for Disease Control and Prevention. Retrieved February 18, 2026, from https://www.cdc.gov/mental-health/living-with/index.html\u003c/li>\n\t\u003cli>Harris, K. M., Gaffey, A. E., Schwartz, J. E., Krantz, D. S., &amp; Burg, M. M. (2023). The Perceived Stress Scale as a Measure of Stress: Decomposing Score Variance in Longitudinal Behavioral Medicine Studies. \u003cem>Annals of behavioral medicine : a publication of the Society of Behavioral Medicine, 57\u003c/em>(10), 846&ndash;854. https://doi.org/10.1093/abm/kaad015\u003c/li>\n\t\u003cli>Yang, X., Fang, Y., Chen, H., Zhang, T., Yin, X., Man, J., Yang, L., &amp; Lu, M. (2021). Global, regional and national burden of anxiety disorders from 1990 to 2019: Results from the global burden of disease study 2019.\u003cem> Epidemiology and Psychiatric Sciences, 30\u003c/em>. https://doi.org/10.1017/s2045796021000275\u003c/li>\n\t\u003cli>Li, J., Cai, Z., Li, X., Du, R., Shi, Z., Hua, Q., Zhang, M., Zhu, C., Zhang, L., &amp; Zhan, X. (2021). Mindfulness-based therapy versus cognitive behavioral therapy for people with anxiety symptoms: a systematic review and meta-analysis of random controlled trials. \u003cem>Annals of palliative medicine, 10\u003c/em>(7), 7596&ndash;7612. https://doi.org/10.21037/apm-21-1212\u003c/li>\n\t\u003cli>Aylett, E., Small, N., &amp; Bower, P. (2018). Exercise in the treatment of clinical anxiety in general practice - a systematic review and meta-analysis. \u003cem>BMC health services research, 18\u003c/em>(1), 559. https://doi.org/10.1186/s12913-018-3313-5\u003c/li>\n\t\u003cli>Kementerian Kesehatan RI. (2019). L\u003cem>aporan nasional Riskesdas 2018.\u003c/em> Badan Penelitian dan Pengembangan Kesehatan Kementerian Kesehatan RI.\u003c/li>\n\u003c/ul>","min_app_version":null,"type":"math","category_id":2,"slug":"stress-anxiety-screening","formula_male":"[anxiety_1] + [anxiety_2] + [anxiety_3] + [anxiety_4] + [anxiety_5] + [anxiety_6] + [stress_1] + [stress_2] + [stress_3] + [stress_4]","formula_female":null,"description":"Sering merasa stres atau cemas? Cek kondisi Anda melalui kuisioner singkat sekarang","is_active":1},"health_faq":[{"id":50,"tool_id":5,"question":"Bagaimana cara kerja Skrining Stres dan Kecemasan?","answer":"Skrining Stres dan Kecemasan meminta Anda menjawab beberapa pertanyaan seputar kondisi emosional, pola pikir, kualitas tidur, dan respons fisik dalam dua minggu terakhir. \nSetiap jawaban memiliki skor yang dijumlahkan untuk menentukan kategori tingkat stres dan kecemasan Anda."},{"id":71,"tool_id":5,"question":"Apakah skrining ini termasuk diagnosis medis?","answer":"Tidak. Skrining ini bukan alat diagnosis medis. Hasil yang diperoleh hanya akan memberikan gambaran tingkat stres atau kecemasan berdasarkan jawaban Anda. \nUntuk diagnosis dan penanganan yang tepat, dibutuhkan evaluasi langsung oleh tenaga profesional, seperti psikolog atau psikiater."},{"id":72,"tool_id":5,"question":"Apa arti dari hasil yang saya dapatkan?","answer":"Skor yang lebih tinggi menunjukkan tingkat stres dan kecemasan yang lebih berat. Hasil Skrining Stres dan Kecemasan ini terbagi ke dalam kategori, meliputi Minimal, Ringan, Sedang, atau Berat. \nSetiap kategori menggambarkan intensitas gejala yang dialami dalam periode tertentu. Jika hasil menunjukkan tingkat sedang hingga tinggi, pertimbangkan untuk berkonsultasi dengan profesional."},{"id":73,"tool_id":5,"question":"Apa perbedaan antara stres dan kecemasan?","answer":"Stres adalah respons tubuh terhadap tekanan atau tuntutan nyata, seperti deadline pekerjaan atau masalah keuangan, dan biasanya mereda setelah pemicunya hilang. \nSementara itu, kecemasan adalah perasaan khawatir atau takut yang berlebihan, umumnya muncul tanpa ancaman nyata, dan cenderung bertahan lebih lama. Keduanya saling memengaruhi dan berdampak pada kesehatan fisik maupun mental."},{"id":74,"tool_id":5,"question":"Apa saja tanda umum gangguan mental?","answer":"Tanda umum, meliputi perubahan suasana hati yang drastis, menarik diri dari lingkungan sosial, gangguan tidur, perubahan nafsu makan, sulit berkonsentrasi, serta munculnya rasa putus asa. \nApabila gejala berlangsung lebih dari dua minggu serta mengganggu aktivitas harian, kondisi ini membutuhkan perhatian lebih lanjut."},{"id":75,"tool_id":5,"question":"Bagaimana cara menjaga kesehatan mental sehari-hari?","answer":"Anda bisa menjaga kesehatan mental dengan tidur cukup 7–9 jam per malam, rutin berolahraga minimal 30 menit sebanyak 3–5 kali per minggu, dan menjaga pola makan seimbang.\nPenting juga untuk membatasi konsumsi kafein setelah pukul 14.00 dan luangkan waktu untuk relaksasi atau aktivitas yang Anda nikmati."},{"id":86,"tool_id":5,"question":"Referensi","answer":"(1) Stress. (2026). American Psychological Association. Retrieved February 18, 2026, from https://www.apa.org/topics/stress | (2) Managing stress. (2026). U.S. Centers for Disease Control and Prevention. Retrieved February 18, 2026, from https://www.cdc.gov/mental-health/living-with/index.html | (3) Harris, K. M., Gaffey, A. E., Schwartz, J. E., Krantz, D. S., & Burg, M. M. (2023). The Perceived Stress Scale as a Measure of Stress: Decomposing Score Variance in Longitudinal Behavioral Medicine Studies. Annals of behavioral medicine : a publication of the Society of Behavioral Medicine, 57(10), 846–854. https://doi.org/10.1093/abm/kaad015"}],"healt
