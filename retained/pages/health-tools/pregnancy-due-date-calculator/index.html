-head="ssr" href="/assets/b7a5878dd46e5275853ac4a9.ico" rel="icon" type="image/x-icon"/><link data-n-head="ssr" href="/assets/1071dc0e93d26fbbc52fadb5.png" rel="icon" sizes="96x96" type="image/png"/><link data-n-head="ssr" href="/assets/a561b10bfaef5c342318dfe0.png" rel="apple-touch-icon" sizes="180x180"/><link href="/assets/6cf4aff216c7a147185e50ae.css" rel="stylesheet"/>

<body class="w-site"><div id="site-header"></div><main id="site-main"><div class="w-legacy-app"><div data-server-rendered="true" id="__nuxt"></div></div><div class="w-container w-live-slot" data-live-catalog=""></div></main><script>window.__NUXT__={"layout":"default","data":[{"detailHealthTool":{"health_tools":{"id":9,"name":"Kalkulator HPL","title":"Kalkulator HPL","image":"/_media/cdn/uploads/imagestorage/banner-pregnant-woman-29-1784790411.png","icon":"/_media/cdn/uploads/imagestorage/icon-pregnancy-45-1784104514.png","color":"#FAE4EC","meta_title":"Kalkulator HPL & Usia Kehamilan Gratis","meta_description":"Pakai Kalkulator HPL Natural Farm untuk hitung hari perkiraan lahir dari HPHT. Pantau usia kehamilan & perkembangan janin minggu per minggu. Coba sekarang!","footer_content":"\u003ch2>\u003cstrong>Tentang Kalkulator HPL\u003c/strong>\u003c/h2>\n\n\u003cp>Kalkulator HPL (Hari Perkiraan Lahir) adalah kalkulator digital yang dapat membantu ibu hamil \u003ca href=\"/blog/2-cara-menghitung-usia-kehamilan-untuk-calon-ibu\">memperkirakan tanggal kelahiran\u003c/a> berdasarkan Hari Pertama Haid Terakhir (HPHT). Kalkulator usia kehamilan ini bekerja menggunakan \u003cstrong>Rumus Naegele\u003c/strong>.&nbsp;\u003c/p>\n\n\u003cp>Hasil dari Kalkulator HPL bukanlah tanggal pasti, melainkan estimasi yang membantu ibu serta tenaga kesehatan merencanakan pemeriksaan, skrining, dan persiapan persalinan sejak awal.\u003c/p>\n\n\u003cp>Selain menghitung HPL, kalkulator ini juga menampilkan usia kehamilan saat ini dalam hitungan minggu, trimester yang sedang berjalan, serta konten perkembangan janin dan panduan \u003ca href=\"/blog/nutrisi-ibu-hamil\">nutrisi untuk ibu hamil\u003c/a> yang disesuaikan per minggu kehamilan.\u003c/p>\n\n\u003ch2>\u003cstrong>Cara Menghitung HPL dari HPHT\u003c/strong>\u003c/h2>\n\n\u003cp>Kalkulator HPL menggunakan Rumus Naegele (Naegele&#39;s Rule) sebagai dasar perhitungan hari perkiraan lahir dan usia kehamilan saat ini. Rumus ini berlaku untuk wanita dengan siklus haid atau menstruasi yang teratur, yakni rata-rata terjadi selama 28 hari setiap bulan.\u003c/p>\n\n\u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; width:624px\">\n\t\u003ctbody>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">&nbsp;\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>HPHT Januari&ndash;Maret\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">\u003cstrong>HPHT April&ndash;Desember\u003c/strong>\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp>Hari\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">+7\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">+7\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp>Bulan\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">+9\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">-3\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\t\u003ctr>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp>Tahun\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">Tetap\u003c/p>\n\t\t\t\u003c/td>\n\t\t\t\u003ctd style=\"border-bottom:1px solid #000000; border-left:1px solid #000000; border-right:1px solid #000000; border-top:1px solid #000000; vertical-align:top\">\n\t\t\t\u003cp style=\"text-align:center\">+1\u003c/p>\n\t\t\t\u003c/td>\n\t\t\u003c/tr>\n\t\u003c/tbody>\n\u003c/table>\n\n\u003cp>Jika HPHT jatuh di bulan Januari hingga Maret, misalnya HPHT adalah 21 Januari 2026, maka perhitungan akan seperti berikut.\u003c/p>\n\n\u003cul>\n\t\u003cli>21 Januari 2026 + 7 hari&nbsp; &rarr;&nbsp; 28 Januari 2026\u003c/li>\n\t\u003cli>28 Januari 2026 + 9 bulan &rarr;&nbsp; 28 Oktober 2026\u003c/li>\n\t\u003cli>28 Oktober 2026 + 0 tahun&nbsp; &rarr;&nbsp; 28 Oktober 2026 (HPL)\u003c/li>\n\u003c/ul>\n\n\u003cp>Sementara itu, saat HPHT ada di bulan April hingga Desember, misalnya HPHT adalah 15 Mei 2026, cara menghitung HPL akan seperti berikut ini.\u003c/p>\n\n\u003cul>\n\t\u003cli>15 Mei 2026 + 7 hari&nbsp; &rarr;&nbsp; 22 Mei 2026\u003c/li>\n\t\u003cli>22 Mei 2026 &minus; 3 bulan &rarr;&nbsp; 22 Februari 2026\u003c/li>\n\t\u003cli>22 Februari 2026 + 1 tahun&nbsp; &rarr;&nbsp; 22 Februari 2027 (HPL)\u003c/li>\n\u003c/ul>\n\n\u003ch2>\u003cstrong>Kalkulator HPL vs Hasil USG: Mana yang Lebih Akurat?\u003c/strong>\u003c/h2>\n\n\u003cp>Kalkulator HPL dan USG sama-sama bisa digunakan untuk memperkirakan hari perkiraan lahir, tetapi metodenya berbeda. Kalkulator HPL mengandalkan tanggal HPHT, sedangkan USG akan mengukur fisik janin secara langsung, seperti panjang tulang paha, lingkar kepala, dan panjang janin, untuk memperkirakan usia kehamilan secara lebih presisi.\u003c/p>\n\n\u003cp>Jika hasil Kalkulator HPL dan USG memiliki selisih lebih dari 1&ndash;2 minggu, \u003ca href=\"/blog/cara-membaca-hasil-usg\">hasil USG dari dokter kandungan\u003c/a> yang akan dijadikan acuan resmi (ACOG, 2017). Ini wajar karena kalkulator hanya seakurat data HPHT yang dimasukkan, sedangkan USG mengukur kondisi janin sebenarnya.\u003c/p>\n\n\u003ch3>\u003cstrong>Kapan Harus Segera Menghubungi Dokter?\u003c/strong>\u003c/h3>\n\n\u003cp>Tubuh akan mengalami perubahan signifikan selama kehamilan. Namun, ada beberapa kondisi yang membutuhkan penanganan segera.&nbsp;\u003c/p>\n\n\u003cp>Hubungi dokter kandungan atau bidan ketika muncul \u003ca href=\"/blog/tanda-bahaya-kehamilan\">tanda-tanda bahaya kehamilan\u003c/a> berikut ini.\u003c/p>\n\n\u003cul>\n\t\u003cli>Perdarahan vagina di trimester kehamilan mana pun.\u003c/li>\n\t\u003cli>Mual dan muntah parah hingga tidak bisa makan atau minum (hiperemesis gravidarum).\u003c/li>\n\t\u003cli>Nyeri perut yang intens, mendadak, atau tidak seperti biasanya.\u003c/li>\n\t\u003cli>Tidak merasakan gerakan janin setelah minggu ke-28.\u003c/li>\n\t\u003cli>Muncul tanda persalinan prematur, seperti kontraksi intens, sebelum minggu ke-37.\u003c/li>\n\t\u003cli>Pembengkakan mendadak di wajah, tangan, atau kaki disertai sakit kepala berat, yang menunjukkan kemungkinan preeklamsia.\u003c/li>\n\u003c/ul>\n\n\u003ch2>\u003cstrong>Panduan Nutrisi per Trimester Kehamilan\u003c/strong>\u003c/h2>\n\n\u003cp>Kebutuhan nutrisi ibu hamil berubah seiring perkembangan janin. Memahami jenis nutrisi kunci di tiap trimester membantu Anda membuat pilihan lebih tepat untuk kesehatan diri dan janin.\u003c/p>\n\n\u003ch3>\u003cstrong>1. Trimester 1: Asam Folat, Vitamin B6, dan Zat Besi\u003c/strong>\u003c/h3>\n\n\u003cp>Di trimester pertama, asam folat adalah nutrisi paling penting. Asam folat 400&ndash;800 mcg per hari mendukung pembentukan tabung saraf janin yang menjadi cikal bakal otak dan sumsum tulang belakang (Crider et al., 2022). Konsumsi idealnya dimulai sejak sebelum hamil atau sesegera mungkin setelah mengetahui \u003ca href=\"/diseases/kehamilan\">kehamilan\u003c/a>.&nbsp;\u003c/p>\n\n\u003cp>Vitamin B6 membantu mengelola gejala mual yang umum terjadi di trimester ini, sedangkan zat besi mendukung peningkatan volume darah ibu yang meningkat signifikan selama kehamilan.\u003c/p>\n\n\u003ch3>\u003cstrong>2. Trimester 2: Kalsium, DHA, dan Zat Besi\u003c/strong>\u003c/h3>\n\n\u003cp>Memasuki trimester kedua, pertumbuhan tulang dan otak janin akan berlangsung sangat pesat. Kalsium 1.000 mg per hari diperlukan oleh ibu hamil untuk mendukung kepadatan tulang janin (APA, 2026).&nbsp;\u003c/p>\n\n\u003cp>DHA dan omega-3 berperan penting di dalam pembentukan jaringan otak dan retina mata janin. Zat besi juga tetap dibutuhkan selama trimester kedua untuk mencegah anemia yang berisiko memengaruhi pasokan nutrisi dan oksigen ke janin.&nbsp;\u003c/p>\n\n\u003cp>Di minggu ke-20 kehamilan, ibu dianjurkan untuk melakukan USG anomali (\u003cem>fetal anomaly scan\u003c/em>) untuk memeriksa struktur organ janin dan mendeteksi kemungkinan cacat lahir.\u003c/p>\n\n\u003ch3>\u003cstrong>3. Trimester 3: Kalsium dan Omega-3\u003c/strong>\u003c/h3>\n\n\u003cp>Di trimester ketiga, kebutuhan kalsium meningkat untuk mendukung proses mineralisasi tulang janin yang berlangsung intensif. Omega-3 dan DHA juga penting untuk membantu pematangan otak janin hingga hari kelahiran. Magnesium membantu mengurangi kram kaki yang sering kali dialami ibu hamil di trimester akhir.&nbsp;\u003c/p>\n\n\u003cp>Pantau \u003ca href=\"/blog/tanda-tanda-mau-melahirkan\">tanda persalinan\u003c/a> dengan cermat mulai minggu ke-35, antara lain kontraksi yang teratur, lendir bercampur darah, atau pecahnya ketuban. Saat tanda-tanda tersebut muncul, segera ke rumah sakit atau klinik bersalin tempat Anda merencanakan persalinan.\u003c/p>\n\n\u003ch2>\u003cstrong>Hari Perkiraan Lahir Sudah Lewat, Apakah Normal?\u003c/strong>\u003c/h2>\n\n\u003cp>Hanya sekitar 5% bayi lahir tepat di hari perkiraan lahir atau HPL (Better Health Channel, 2022). Sebagian besar kelahiran terjadi antara minggu ke-37 hingga ke-42, dengan puncak kelahiran di sekitar minggu ke-39 hingga ke-40.&nbsp;\u003c/p>\n\n\u003cp>Jika HPL sudah terlewati, ini termasuk kehamilan lewat bulan (\u003cem>post-term pregnancy\u003c/em>) dan bukan kondisi otomatis berbahaya untuk \u003ca href=\"/blog/kesehatan-ibu-hamil\">kesehatan ibu hamil\u003c/a> dan bayi. Akan tetapi, dokter kandungan akan meningkatkan frekuensi pemantauan untuk memastikan kondisi janin tetap baik.&nbsp;\u003c/p>\n\n\u003cp>Pada minggu ke-41 hingga ke-42, dokter umumnya akan mempertimbangkan prosedur induksi persalinan atau langkah medis lain, seperti operasi Caesar, sesuai kondisi ibu dan janin.\u003c/p>\n\n\u003cdiv style=\"background:#eeeeee; border:1px solid #cccccc; padding:5px 10px\">\n\u003ch2>\u003cstrong>Disclaimer\u003c/strong>\u003c/h2>\n\n\u003cp>Hasil Kalkulator HPL ini bersifat \u003cstrong>informatif dan tidak menggantikan pemeriksaan medis\u003c/strong>. HPL adalah estimasi hari perkiraan lahir berdasarkan HPHT, bukan tanggal pasti kelahiran. Untuk konfirmasi HPL yang akurat, lakukan pemeriksaan USG bersama dokter kandungan.\u003c/p>\n\u003c/div>\n\n\u003cp style=\"text-align:center\">&nbsp;\u003c/p>\n\n\u003cp>\u003cstrong>References:&nbsp;\u003c/strong>\u003c/p>\n\n\u003cul>\n\t\u003cli>\u003cem>Pregnancy week-by-week: Baby development, symptoms &amp; signs\u003c/em>. (2026). What to Expect. Retrieved July 6, 2026, from https://www.whattoexpect.com/pregnancy/week-by-week/\u003c/li>\n\t\u003cli>\u003cem>Overdue babies. \u003c/em>(2022). Better Health Channel. Retrieved July 6, 2026, from https://www.betterhealth.vic.gov.au/health/servicesandsupport/overdue-babies\u003c/li>\n\t\u003cli>\u003cem>How big is your baby? \u003c/em>(2026). Pregnancy, Birth and Baby. Retrieved July 6, 2026, from https://www.pregnancybirthbaby.org.au/how-big-is-your-baby-infographic\u003c/li>\n\t\u003cli>\u003cem>Calcium in pregnancy.\u003c/em> (2026). American Pregnancy Association. Retrieved July 6, 2026, from https://americanpregnancy.org/pregnancy/calcium-in-pregnancy/\u003c/li>\n\t\u003cli>\u003cem>What to expect at your 20 week ultrasound. \u003c/em>(2025). Cleveland Clinic. Retrieved July 6, 2026, from https://my.clevelandclinic.org/health/diagnostics/22644-20-week-ultrasound\u003c/li>\n\t\u003cli>Crider, K. S., Qi, Y. P., Yeung, L. F., Mai, C. T., Head Zauche, L., Wang, A., Daniels, K., &amp; Williams, J. L. (2022). Folic Acid and the Prevention of Birth Defects: 30 Years of Opportunity and Controversies.\u003cem> Annual review of nutrition, 42\u003c/em>, 423&ndash;452. https://doi.org/10.1146/annurev-nutr-043020-091647\u003c/li>\n\t\u003cli>Lawson G. W. (2021). Naegele&#39;s rule and the length of pregnancy - A review.\u003cem> The Australian &amp; New Zealand journal of obstetrics &amp; gynaecology, 61\u003c/em>(2), 177&ndash;182. https://doi.org/10.1111/ajo.13253\u003c/li>\n\t\u003cli>Committee Opinion No 700: Methods for Estimating the Due Date. (2017). \u003cem>Obstetrics and gynecology, 129\u003c/em>(5), e150&ndash;e154. https://doi.org/10.1097/AOG.000000000000204\u003c/li>\n\u003c/ul>","min_app_version":"1.3.36","type":"date","category_id":3,"slug":"pregnancy-due-date-calculator","formula_male":null,"formula_female":null,"description":"Hitung Hari Perkiraan Lahir (HPL) dari Hari Pertama Haid Terakhir (HPHT) dan pantau kehamilan minggu per minggu","is_active":1},"health_faq":[{"id":100,"tool_id":9,"question":"Apa Itu HPL?","answer":"HPL atau Hari Perkiraan Lahir adalah estimasi tanggal kelahiran yang dihitung berdasarkan Hari Pertama Haid Terakhir (HPHT). Kalkulator HPL memakai Rumus Naegele. HPL adalah perkiraan, hanya sekitar 5% bayi lahir tepat di tanggal HPL. Konfirmasi dengan USG dengan dokter kandungan untuk hasil yang lebih akurat."},{"id":101,"tool_id":9,"question":"Seberapa akurat hasil Kalkulator HPL?","answer":"Kalkulator HPL memberikan estimasi berdasarkan HPHT dan siklus haid menggunakan Rumus Naegele. Akurasi bisa bervariasi karena beberapa faktor, termasuk panjang siklus menstruasi, waktu ovulasi, dan kondisi kesehatan ibu. Untuk konfirmasi HPL yang lebih akurat, pemeriksaan USG di trimester pertama adalah cara terbaik yang disarankan dokter kandungan."},{"id":102,"tool_id":9,"question":"Siapa saja yang bisa menggunakan Kalkulator HPL?","answer":"Kalkulator usia kehamilan ini dapat digunakan siapa saja yang baru mengetahui kehamilan atau memantau perkembangan. Anda hanya perlu mengetahui tanggal HPHT untuk memulai. Kalkulator HPL ini juga berguna untuk memverifikasi HPL yang telah diberikan dokter, atau sekadar memantau perkembangan janin minggu per minggu."},{"id":103,"tool_id":9,"question":"Apakah Kalkulator HPL bisa digunakan untuk diagnosis medis?","answer":"Tidak. Kalkulator HPL bersifat informatif dan tidak mengganti diagnosis atau pemeriksaan medis. Hasil HPL adalah estimasi berdasarkan data HPHT Anda. Untuk kehamilan berisiko tinggi, konsultasikan langsung dengan dokter kandungan atau bidan terpercaya."},{"id":104,"tool_id":9,"question":"Kenapa HPL dari kalkulator berbeda dengan hasil USG?","answer":"Perbedaan HPL kalkulator dan USG adalah hal yang wajar. Kalkulator menggunakan HPHT sebagai acuan, sedangkan USG akan mengukur ukuran janin untuk memperkirakan HPL secara lebih presisi. Apabila selisihnya lebih dari 1–2 minggu, hasil USG dari dokter kandungan sebaiknya dijadikan acuan utama (ACOG, 2017)."},{"id":105,"tool_id":9,"question":"Apakah kehamilan kembar memengaruhi hasil Kalkulator HPL?","answer":"Kalkulator HPL memakai HPHT sebagai dasar perhitungan, sehingga hasilnya sama untuk kehamilan tunggal maupun kembar. Akan tetapi, kehamilan kembar biasanya berlangsung lebih singkat, sekitar 36–37 minggu. Karena itu, HPL harus dikonfirmasi langsung dengan dokter kandungan yang akan menyesuaikan perkiraan berdasarkan hasil USG dan kondisi kehamilan Anda."},{"id":127,"tool_id":9,"question":"Referensi","answer":"Pregnancy week-by-week: Baby development, symptoms & signs. (2026). What to Expect. Retrieved July 6, 2026, from https://www.whattoexpect.com/pregnancy/week-by-week/\nOverdue babies. (2022). Better Health Channel. Retrieved July 6, 2026, from https://www.betterhealth.vic.gov.au/health/servicesandsupport/overdue-babies\nHow big is your baby? (2026). Pregnancy, Birth and Baby. Retrieved July 6, 2026, from https://www.pregnancybirthbaby.org.au/how-big-is-your-baby-infographic"}],"health_questions":[{"step":1,"questions":[{"id":73,"tool_id":9,"step":1,"sequence":1,"variable_name":"name","validate":"required|string|min:3|max:255","question_text":"Siapa nama Anda?","question_image":null,"description":null,"input_type":"text","is_gender_specific":"0","suffix":null,"default":null,"health_questions_options":[]},{"id":74,"tool_id":9,"step":1,"sequence":2,"variable_name":"hpht","validate":"required|date|after_or_equal:1900-01-01|before_or_equal:today","question_text":"Kapan hari pertama haid terakhir Anda?","question_image":null,"description":"*Hitung dari hari PERTAMA menstruasi terakhir Anda, bukan hari ovulasi atau konsepsi.","input_type":"date","is_gender_specific":"0","suffix":null,"default":null,"health_questions_options":[]},{"id":76,"tool_id":9,"step":1,"sequence":3,"variable_name":"cycle_days","validate":"required","question_text":"Berapa lama siklus haid Anda
